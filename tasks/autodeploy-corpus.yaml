# Корпус бенчмарка автоподнимателя. Пины обязательны: без них прогоны несравнимы.
# shape — что реально лежит в корне на пине (проверено HTTP 200 на raw.githubusercontent).
# port — порт, который наше определение обязано выдать на ступени 1.
# probe — путь, ответ 2xx/3xx на котором считается «живой» (ступень 4).
# port: 0 вместе с port_source: env означает «приложение слушает $PORT, который
# назначает платформа»: правильное поведение детектора здесь — НЕ называть порт,
# а любое названное число является выдумкой и считается провалом.
# Так исправлены firefly-iii и miniflux (было 8080): у обоих в корне лежит только
# Procfile. У firefly-iii это `web: vendor/bin/heroku-php-nginx`, который биндит
# $PORT; у miniflux — `web: miniflux.app`, а сам miniflux переопределяет
# LISTEN_ADDR из PORT (internal/config/parser.go). 8080 был портом их docker-образа,
# то есть ожиданием от другого пути развёртывания.
