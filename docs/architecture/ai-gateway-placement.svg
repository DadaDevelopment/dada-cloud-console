<svg viewBox="0 0 1060 660" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>AI Gateway: что куда</title>
  <desc>Схема размещения AI Gateway: горячий путь через выделенный ingress и LiteLLM-рантайм, control-plane отдельно, Spring Gateway и codex-lb вне пути.</desc>
  <style>
    :root{
      --bg:#ffffff; --ink:#0f172a; --sub:#475569; --line:#94a3b8;
      --new:#2563eb; --newbg:#eff6ff; --reuse:#059669; --reusebg:#ecfdf5;
      --off:#dc2626; --offbg:#fef2f2; --band:#f1f5f9;
    }
    @media (prefers-color-scheme:dark){
      :root{ --bg:#0b1220; --ink:#e2e8f0; --sub:#94a3b8; --line:#475569;
        --new:#60a5fa; --newbg:#0f1f3a; --reuse:#34d399; --reusebg:#0c2a20;
        --off:#f87171; --offbg:#2a1315; --band:#0f172a; }
    }
    .t{fill:var(--ink);font-weight:700}
    .s{fill:var(--sub);font-size:12px}
    .lbl{fill:var(--ink);font-size:13px;font-weight:600}
    .band{fill:var(--band)}
    .arw{stroke:var(--line);stroke-width:2;fill:none;marker-end:url(#a)}
    .arwd{stroke:var(--line);stroke-width:2;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--line)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="660" fill="var(--bg)"/>

  <text x="30" y="34" class="t" font-size="19">AI Gateway — что куда</text>

  <!-- DATA PLANE band -->
  <rect x="20" y="58" width="1020" height="180" rx="12" class="band"/>
  <text x="38" y="80" class="s" font-weight="700">ГОРЯЧИЙ ПУТЬ (данные)</text>

  <!-- client -->
  <rect x="34" y="98" width="140" height="86" rx="10" fill="var(--reusebg)" stroke="var(--reuse)" stroke-width="1.5"/>
  <text x="104" y="132" text-anchor="middle" class="lbl">Клиент</text>
  <text x="104" y="152" text-anchor="middle" class="s">OpenAI SDK</text>
  <text x="104" y="168" text-anchor="middle" class="s">Bearer sk-dada-…</text>

  <path d="M176 141 H214" class="arw"/>

  <!-- ingress -->
  <rect x="216" y="98" width="150" height="86" rx="10" fill="var(--newbg)" stroke="var(--new)" stroke-width="1.5"/>
  <text x="291" y="128" text-anchor="middle" class="lbl">Свой ingress</text>
  <text x="291" y="148" text-anchor="middle" class="s">buffering off</text>
  <text x="291" y="164" text-anchor="middle" class="s">3600s · 50m</text>

  <path d="M368 141 H406" class="arw"/>

  <!-- litellm runtime -->
  <rect x="408" y="90" width="330" height="130" rx="12" fill="var(--newbg)" stroke="var(--new)" stroke-width="2"/>
  <text x="573" y="112" text-anchor="middle" class="lbl">AI Gateway Runtime</text>
  <text x="573" y="129" text-anchor="middle" class="s">LiteLLM 1.92.0 (pinned) + плагины</text>
  <rect x="422" y="140" width="302" height="24" rx="6" fill="var(--bg)" stroke="var(--line)"/>
  <text x="573" y="156" text-anchor="middle" class="s">custom_auth → проект (sk-dada)</text>
  <rect x="422" y="168" width="302" height="24" rx="6" fill="var(--bg)" stroke="var(--line)"/>
  <text x="573" y="184" text-anchor="middle" class="s">pre_call_hook → BYOK + резерв + id</text>
  <rect x="422" y="196" width="302" height="18" rx="6" fill="var(--bg)" stroke="var(--line)"/>
  <text x="573" y="209" text-anchor="middle" class="s">callbacks → расход в ledger</text>

  <path d="M740 141 H784" class="arw"/>

  <!-- providers -->
  <rect x="786" y="98" width="240" height="86" rx="10" fill="var(--reusebg)" stroke="var(--reuse)" stroke-width="1.5"/>
  <text x="906" y="126" text-anchor="middle" class="lbl">Провайдеры</text>
  <text x="906" y="146" text-anchor="middle" class="s">Anthropic · Groq</text>
  <text x="906" y="162" text-anchor="middle" class="s">OpenRouter · SambaNova</text>
  <text x="906" y="178" text-anchor="middle" class="s">Gemini*</text>

  <!-- CONTROL PLANE band -->
  <rect x="20" y="256" width="1020" height="150" rx="12" class="band"/>
  <text x="38" y="278" class="s" font-weight="700">CONTROL-PLANE (управляет, НЕ в пути)</text>

  <rect x="34" y="296" width="200" height="92" rx="10" fill="var(--reusebg)" stroke="var(--reuse)" stroke-width="1.5"/>
  <text x="134" y="326" text-anchor="middle" class="lbl">Консоль</text>
  <text x="134" y="346" text-anchor="middle" class="s">реестр моделей/провайдеров</text>
  <text x="134" y="362" text-anchor="middle" class="s">дашборд usage</text>
  <path d="M234 320 C 340 300, 470 300, 500 132" class="arwd"/>
  <text x="360" y="292" class="s">push конфиг</text>

  <rect x="270" y="296" width="230" height="92" rx="10" fill="var(--reusebg)" stroke="var(--reuse)" stroke-width="1.5"/>
  <text x="385" y="322" text-anchor="middle" class="lbl">Backend (reuse)</text>
  <text x="385" y="342" text-anchor="middle" class="s">decrypt секрет провайдера</text>
  <text x="385" y="358" text-anchor="middle" class="s">квота · ledger ingest</text>
  <text x="385" y="374" text-anchor="middle" class="s">секреты НЕ в git</text>
  <path d="M470 300 C 520 270, 560 250, 573 222" class="arwd"/>
  <text x="520" y="250" class="s">internal</text>

  <rect x="536" y="296" width="230" height="92" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="651" y="326" text-anchor="middle" class="lbl">Postgres ledger</text>
  <text x="651" y="348" text-anchor="middle" class="s">source of truth</text>
  <text x="651" y="366" text-anchor="middle" class="s">биллинг по расходу</text>

  <rect x="802" y="296" width="224" height="92" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="914" y="326" text-anchor="middle" class="lbl">Redis</text>
  <text x="914" y="348" text-anchor="middle" class="s">резервы · rate-limit</text>
  <text x="914" y="366" text-anchor="middle" class="s">fail-open, не truth</text>

  <!-- NOT IN PATH band -->
  <text x="38" y="440" class="s" font-weight="700">ВНЕ AI-ПУТИ</text>
  <rect x="34" y="452" width="320" height="76" rx="10" fill="var(--offbg)" stroke="var(--off)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="194" y="480" text-anchor="middle" class="lbl">Spring Gateway ✗</text>
  <text x="194" y="500" text-anchor="middle" class="s">Keycloak-JWT only, нет sk-dada/тенанта</text>
  <text x="194" y="516" text-anchor="middle" class="s">не трогаем, НЕ в пути</text>

  <rect x="368" y="452" width="330" height="76" rx="10" fill="var(--offbg)" stroke="var(--off)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="533" y="480" text-anchor="middle" class="lbl">codex-lb</text>
  <text x="533" y="500" text-anchor="middle" class="s">не гейтвей (single-upstream ChatGPT)</text>
  <text x="533" y="516" text-anchor="middle" class="s">опц. upstream: пул подписок ChatGPT</text>

  <rect x="712" y="452" width="314" height="76" rx="10" fill="var(--offbg)" stroke="var(--off)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="869" y="480" text-anchor="middle" class="lbl">AI Studio / KServe</text>
  <text x="869" y="500" text-anchor="middle" class="s">хостинг своих моделей</text>
  <text x="869" y="516" text-anchor="middle" class="s">соседний продукт, не трогаем</text>

  <!-- legend -->
  <g transform="translate(34,558)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="var(--newbg)" stroke="var(--new)"/>
    <text x="20" y="12" class="s">новое (AI Gateway)</text>
    <rect x="180" y="0" width="14" height="14" rx="3" fill="var(--reusebg)" stroke="var(--reuse)"/>
    <text x="200" y="12" class="s">reuse (уже есть)</text>
    <rect x="350" y="0" width="14" height="14" rx="3" fill="var(--offbg)" stroke="var(--off)" stroke-dasharray="4 3"/>
    <text x="370" y="12" class="s">вне пути</text>
    <line x1="470" y1="7" x2="500" y2="7" class="arwd"/>
    <text x="506" y="12" class="s">управление (не трафик)</text>
  </g>
  <text x="30" y="622" class="s">* Gemini — включаем после 1 реальной проверки redaction. Пин 1.92.0, апгрейд = прогнать G3-suite.</text>
</svg>
