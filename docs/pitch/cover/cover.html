<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:linear-gradient(135deg,#0b1220 0%,#152449 45%,#1e3a8a 100%);color:#fff;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(120px)}

.g2{width:640px;height:640px;right:-160px;bottom:-220px;background:rgba(8,145,178,.42)}

.brand{display:flex;align-items:center;gap:36px}
.mark{width:132px;height:132px;border-radius:30px;background:#2563eb;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 70px rgba(37,99,235,.55)}

.tag{margin-top:44px;font-size:46px;font-weight:600;line-height:1.25;letter-spacing:-1px;max-width:1240px;color:#e2e8f0}
.sub{margin-top:26px;font-size:30px;line-height:1.4;max-width:1120px;color:#93a4c2}
.pills{margin-top:60px;display:flex;gap:20px}
.pill{padding:18px 34px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);font-size:27px;font-weight:600;color:#e8eefc}
.foot{position:absolute;left:140px;bottom:74px;font-size:28px;font-weight:600;color:#7f94b8;letter-spacing:.5px}

  <div class="pills"><div class="pill">Работает в проде</div><div class="pill">109 приложений</div><div class="pill">47 пользователей</div></div>
</div>
