apiVersion: batch/v1
kind: CronJob
metadata:
  name: vibecoder-news-ingest
  namespace: agent-sandbox-prod
spec:
  schedule: "17 */3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: nexus-cred
          containers:
            - name: ingest
              image: IMAGE_PINNED_BY_APPLY_SCRIPT
              command: ["python", "news_ingest.py", "--max-age-days", "14"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: tg-vibecoder-env
                      key: DATABASE_URL
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
