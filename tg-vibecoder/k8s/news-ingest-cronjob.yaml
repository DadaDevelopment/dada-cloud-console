apiVersion: batch/v1
kind: CronJob
metadata:
  name: vibecoder-news-ingest
  namespace: agent-sandbox-prod
spec:
  schedule: "17 */3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ingest
              image: REPLACED_BY_CI
              command: ["python", "news_ingest.py", "--max-age-days", "14"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: vibecoder-db
                      key: dsn
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
