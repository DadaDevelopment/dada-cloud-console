apiVersion: batch/v1
kind: CronJob
metadata:
  name: vibecoder-channel-ingest
  namespace: agent-sandbox-prod
spec:
  suspend: true
  schedule: "42 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: nexus-cred
          containers:
            - name: ingest
              image: IMAGE_PINNED_BY_APPLY_SCRIPT
              command: ["sh", "-c", "exec python channel_ingest.py \"$CHANNEL_SLUG\" --pages 3"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: tg-vibecoder-env
                      key: DATABASE_URL
                - name: CHANNEL_SLUG
                  valueFrom:
                    configMapKeyRef:
                      name: vibecoder-config
                      key: channel_slug
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
