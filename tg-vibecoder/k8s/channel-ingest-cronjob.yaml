apiVersion: batch/v1
kind: CronJob
metadata:
  name: vibecoder-channel-ingest
  namespace: agent-sandbox-prod
spec:
  schedule: "42 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ingest
              image: REPLACED_BY_CI
              command: ["python", "channel_ingest.py", "--pages", "3"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: vibecoder-db
                      key: dsn
                - name: CHANNEL_SLUG
                  valueFrom:
                    configMapKeyRef:
                      name: vibecoder-config
                      key: channel_slug
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
