          description: object with project_id, default_environment_id, org_id and
            role
          schema:
            additionalProperties: true
            type: object
        "201":
          description: newly created default project
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get or create the caller's default project
      tags:
      - project
  /webhooks/yookassa:
    post:
      consumes:
      - application/json
      description: Re-fetches the authoritative payment status by id and applies it.
        Never trusts the webhook payload's status field.
      operationId: yookassaWebhook
      produces:
