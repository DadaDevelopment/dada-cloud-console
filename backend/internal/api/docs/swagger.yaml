  /box/leads:
    post:
      consumes:
      - application/json
      description: Stores one funnel event from the Dada Box private-preview landing
        (page_view, demo_run, box_requested, crystallize_intent) into box_funnel_events,
        and the lead itself into box_leads when the event is box_requested. Unauthenticated
        marketing ingest, called server-to-server by the landing's route handler,
        rate-limited per client IP. `vid` is the opaque dada_vid visitor cookie and
        must be a UUID -- never an email or any other personal datum. A page_view
