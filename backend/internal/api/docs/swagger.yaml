      - application/json
      responses:
        "200":
          description: object with a repos array
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List git-linked repos in an environment
      tags:
      - git
    post:
      consumes:
      - application/json
      description: Links a GitHub/GitLab repository to an app in an environment so
        pushes trigger builds. Stores any GitLab token encrypted and generates a per-repo
        webhook secret. Requires write access.
      operationId: connectGitRepo
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Environment UUID
        in: path
        name: envId
        required: true
        type: string
      - description: Repo link specification
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.connectGitRepoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: object with a repos array
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Link a git repository to an app
      tags:
      - git
  /projects/{projectId}/environments/{envId}/repos/{repoId}:
    delete:
      description: Removes the git link for an app. Builds/deployments already created
        are retained. Requires write access.
      operationId: disconnectGitRepo
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Environment UUID
        in: path
        name: envId
        required: true
        type: string
      - description: Git repo UUID
        in: path
        name: repoId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Unlink a git repository
      tags:
      - git
  /projects/{projectId}/environments/{envId}/s3buckets:
    get:
      description: Returns all managed S3 storage buckets (S3Bucket) in the given
        project environment.
      operationId: listS3Buckets
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Environment UUID
        in: path
        name: envId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with a buckets array of ResourceSnapshot
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List S3 buckets in an environment
      tags:
      - storage
    post:
      consumes:
      - application/json
      description: 'Provisions a new Beget S3 bucket via Crossplane (S3Bucket XR).
        Async: returns 202 with an operation; poll until terminal.'
      operationId: createS3Bucket
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Environment UUID
        in: path
        name: envId
        required: true
        type: string
      - description: Bucket specification
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createS3BucketRequest'
      produces:
      - application/json
      responses:
        "202":
          description: object with the accepted operation
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Order a managed S3 object storage bucket
      tags:
      - storage
  /projects/{projectId}/environments/{envId}/s3buckets/{name}/credentials:
    get:
      description: Reveals the S3 endpoint, access key and secret key for a bucket
        by reading its Crossplane connection secret. Requires reveal=true and write
        access; every reveal is audited. Returns 404 while the bucket is still provisioning
        (no secret yet) and 503 when in-cluster credential access is not configured.
      operationId: getS3BucketCredentials
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Environment UUID
        in: path
        name: envId
        required: true
        type: string
      - description: Bucket resource name
        in: path
        name: name
        required: true
        type: string
      - description: Must be true to reveal the credentials
        in: query
        name: reveal
        required: true
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: object with endpoint, access_key, secret_key, bucket_name
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reveal an S3 bucket's access credentials
      tags:
      - storage
  /projects/{projectId}/git/github/authorize:
    get:
      description: Returns a GitHub OAuth authorize URL. After the user authorizes,
        the callback binds the installations that user can access to this project.
        canWrite required. 503 when GitHub OAuth is unconfigured.
      operationId: startGitHubUserAuth
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with a url field
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Start GitHub App user authorization for a project
      tags:
      - git
  /projects/{projectId}/git/install-url:
    get:
      description: Returns the GitHub App (or GitLab) install URL, with project +
        CSRF state encoded, that the user visits to grant repository access. Requires
        write access.
      operationId: getGitInstallUrl
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: 'Provider: github | gitlab'
        in: query
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with the install url
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the git provider install URL
      tags:
      - git
  /projects/{projectId}/git/installations:
    get:
      description: Returns the GitHub App (or GitLab) installations bound to the project's
        org.
      operationId: listGitInstallations
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with an installations array
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List git provider installations for a project
      tags:
      - git
    post:
      consumes:
      - application/json
      description: Attaches an already-installed GitHub App installation to the project
        (resolves the account via the build-agent, upserts git_app_installations).
        Requires write access.
      operationId: bindInstallation
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Installation id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.bindInstallationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.gitInstallation'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Bind an existing git App installation to a project
      tags:
      - git
  /projects/{projectId}/git/installations/{installationId}/detect:
    get:
      description: Proxies to the build-agent, which inspects the repository tree
        (including a shallow recursive search under the chosen root dir) and returns
        a best-effort framework guess. Requires write access. Returns 503 when the
        build-agent is not configured.
      operationId: detectFramework
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Installation UUID
        in: path
        name: installationId
        required: true
        type: string
      - description: Repository full name (org/repo)
        in: query
        name: repo
        required: true
        type: string
      - description: Subdirectory to inspect (default .)
        in: query
        name: root_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: framework detection result
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Detect a repository's framework
      tags:
      - git
  /projects/{projectId}/git/installations/{installationId}/repos:
    get:
      description: Proxies to the build-agent, which lists the repositories the given
        installation can access. Requires write access. Returns 503 when the build-agent
        is not configured.
      operationId: listInstallationRepos
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Installation UUID
        in: path
        name: installationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with a repos array
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List repositories visible to an installation
      tags:
      - git
  /projects/{projectId}/git/installations/available:
    get:
      description: Lists GitHub App installations scoped to the project's org (each
        org owns its own GitHub accounts). Installations from other orgs are never
        returned. canWrite required. 503 when the build-agent is unconfigured.
      operationId: listAvailableInstallations
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with an installations array
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List bindable git App installations for the project's org
      tags:
      - git
  /projects/{projectId}/logs:
    get:
      description: Runs an aggregated Elasticsearch log search scoped to the project.
        Read-only. At least one of vm or app is required and must belong to the project
        (prevents reading another tenant's logs). q is a free-text filter; since selects
        the window (15m, 1h, 6h, 24h, 7d; default 1h); size caps results (1-1000,
        default 200).
      operationId: searchLogs
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: App server (VM) name to scope logs to
        in: query
        name: vm
        type: string
      - description: App name to scope logs to
        in: query
        name: app
        type: string
      - description: Free-text search query
        in: query
        name: q
        type: string
      - description: 'Time window: 15m, 1h, 6h, 24h or 7d (default 1h)'
        in: query
        name: since
        type: string
      - description: Max log entries to return (1-1000, default 200)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: object with a log entries array
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Search aggregated logs in a project
      tags:
      - observability
  /projects/{projectId}/monitoring:
    get:
      description: Returns the monitoring apps in a project across all environments.
        Only the displayable api_key_prefix is returned; secrets are never exposed.
      operationId: listMonitoringApps
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with a monitoring_apps array
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List monitoring resources
      tags:
      - monitoring
  /projects/{projectId}/monitoring/{appId}/logs:
    post:
      consumes:
      - application/json
      description: Writes a single application log document to Elasticsearch (dada-app-logs-*).
        Requires the logs:write scope. Tenancy labels are applied from authoritative
        DB values.
      operationId: ingestLogs
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Monitoring app UUID
        in: path
        name: appId
        required: true
        type: string
      - description: Log payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ingestLogsRequest'
      produces:
      - application/json
      responses:
        "202":
          description: object with ingested count
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ingest a log line
      tags:
      - monitoring
  /projects/{projectId}/monitoring/{appId}/metrics:
    post:
      consumes:
      - application/json
      description: Converts a JSON metrics payload into Prometheus remote-write and
        pushes it. Requires the metrics:write scope. Tenancy labels (org_id, project_id,
        environment) are applied from authoritative DB values.
      operationId: ingestMetrics
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Monitoring app UUID
        in: path
        name: appId
        required: true
        type: string
      - description: Metrics payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ingestMetricsRequest'
      produces:
      - application/json
      responses:
        "202":
          description: object with ingested count
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ingest metrics
      tags:
      - monitoring
  /projects/{projectId}/operations:
    get:
      description: Returns the 50 most recent async operations for a project (newest
        first), with their current status. Read-only. Use this to track the outcome
        of create/update/delete calls.
      operationId: listOperations
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with an operations array
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List recent operations in a project
      tags:
      - operation
  /projects/{projectId}/operations/{operationId}:
    get:
      description: Returns the current state (status, error, git/argo metadata) of
        a single async operation. Read-only. Poll this after any create/update/delete
        call until the operation reaches a terminal status (Ready or Failed).
      operationId: getOperation
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Operation UUID
        in: path
        name: operationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with the operation
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the state of an async operation
      tags:
      - operation
  /projects/{projectId}/operations/{operationId}/retry:
    post:
      description: 'Re-queues a failed operation for another processing attempt (resets
        it to Created and clears the prior error). Only operations in the Failed state
        can be retried. Asynchronous: returns 202 with the re-queued operation; poll
        it until terminal.'
      operationId: retryOperation
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Operation UUID
        in: path
        name: operationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: object with the re-queued operation
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Retry a failed operation
      tags:
      - operation
  /projects/{projectId}/quotas:
    get:
      description: Returns the project's CPU/GPU model quota limits, the number of
        models currently in use, and the advisory monthly inference-call counter.
        Read-only.
      operationId: getProjectQuotas
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with quota limits and current usage
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a project's quotas and usage
      tags:
      - quota
  /projects/default:
    post:
      description: Returns the caller's default project, provisioning one (in your
        personal org, you are Owner) when you have zero projects. Idempotent — repeated
        calls return the same project.
      operationId: ensureDefaultProject
      produces:
      - application/json
      responses:
        "200":
          description: object with project_id, default_environment_id, org_id and
            role
          schema:
            additionalProperties: true
            type: object
        "201":
          description: newly created default project
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get or create the caller's default project
      tags:
      - project
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
