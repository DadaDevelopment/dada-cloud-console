        type: string
    type: object
  api.autofixRequest:
    properties:
      error:
        type: string
    type: object
  api.bindInstallationRequest:
    properties:
      installation_id:
        description: numeric GitHub installation id
        type: string
    type: object
  api.boxUpRequest:
    properties:
      image:
        type: string
      name:
        type: string
      profile:
        type: string
      region:
        type: string
      session_ttl_hours:
        description: SessionTTLHours defaults to 12 and is capped at 168.
        type: integer
      spend_cap_rub:
        type: number
      ssh_public_key:
        description: |-
          SSHPublicKey is a PUBLIC key: the caller keeps the private half, so the
          platform stores no customer credential at all.
        type: string
      ttl_seconds:
        description: TTLSeconds is when the box goes to SLEEP, not when it is destroyed.
        type: integer
      wait_seconds:
        description: |-
          WaitSeconds bounds how long the caller is willing to wait, in [0,360],
          defaulting to 240. It is a bound and not a hint: exceeding it returns a
          classified failure rather than a body that arrives after the caller gave up.
          A cold start measured at ~176s is what the default has to clear.
        type: integer
    type: object
