basePath: /api/v1
definitions:
  api.addDomainAuthorizationRequest:
    properties:
      apex_domain:
        type: string
    type: object
  api.attachHostnameRequest:
    properties:
      hostname:
        type: string
    type: object
  api.bindInstallationRequest:
    properties:
      installation_id:
        description: numeric GitHub installation id
        type: string
    type: object
  api.connectGitRepoRequest:
    properties:
      app_name:
        type: string
      auto_deploy:
        type: boolean
      clone_url:
        type: string
      framework_override:
        type: string
      installation_id:
        type: string
      port:
        description: |-
          Intended app spec, applied by the first successful build when it creates the
          app. Defaulted server-side when omitted (8080 / 2 / small).
        type: integer
      production_branch:
        type: string
      profile:
        type: string
      provider:
        description: Provider defaults to github when an installation_id is supplied.
        type: string
      replicas:
        type: integer
      repo_full_name:
        type: string
      root_dir:
        type: string
      token:
        description: 'GitLab only: a personal/project access token to store encrypted.
          Ignored for GitHub.'
        type: string
    type: object
  api.createAIModelRequest:
    properties:
      artifact_uri:
        type: string
      attached_app_name:
        type: string
      auth_mode:
        $ref: '#/definitions/models.AIModelAuthMode'
      container_image:
        type: string
      mlflow_name:
        type: string
      mlflow_version:
        type: string
      model_type:
        type: string
      name:
        type: string
      profile:
        type: string
      source:
        $ref: '#/definitions/models.AIModelSource'
      version:
        type: string
    type: object
  api.createAppRequest:
    properties:
      image:
        type: string
      name:
        type: string
      port:
        type: integer
      profile:
        type: string
      replicas:
        type: integer
    type: object
  api.createAppServerRequest:
    properties:
      flavor:
        type: string
      mode:
        description: '"terraform" (default) | "manual"'
        type: string
      name:
        type: string
      os_image:
        type: string
      region:
        type: string
      ssh_key_name:
        type: string
      ssh_port:
        type: integer
      ssh_private_key:
        type: string
      ssh_user:
        type: string
      vm_ip:
        description: Manual-mode fields (connecting a pre-existing VM over SSH).
        type: string
    type: object
  api.createCloudTaskRequest:
    properties:
      task_type:
        type: string
    type: object
  api.createEndpointRequest:
    properties:
      auth_enabled:
        type: boolean
      auth_scheme:
        type: string
      auth_scopes:
        items:
          type: string
        type: array
      fqdn:
        type: string
      swagger_enabled:
        type: boolean
      swagger_path:
        type: string
      swagger_title:
        type: string
    type: object
  api.createMonitoringRequest:
    properties:
      name:
        type: string
    type: object
  api.createProjectRequest:
    properties:
      default_environment:
        description: DefaultEnvironment names the first environment; defaults to "prod".
        type: string
      display_name:
        description: DisplayName is the human label; defaults to Slug when empty.
        type: string
      org_id:
        description: |-
          OrgID is the owning org. Empty → the caller's personal org (their username).
          A non-empty value requires the caller to be Owner/Admin of that org.
        type: string
      slug:
        description: Slug is the project name (DNS-1123-label-safe). Unique platform-wide.
        type: string
    required:
    - slug
    type: object
  api.createS3BucketRequest:
    properties:
      app_ref:
        description: AppRef optionally binds the bucket to an app's chart. Empty =
          env-level shared storage.
        type: string
      bucket_name:
        type: string
      description:
        type: string
      ftp_sftp_enable:
        type: boolean
      name:
        type: string
      public:
        type: boolean
      region:
        type: string
    type: object
  api.createServiceDatabaseRequest:
    properties:
      app_ref:
        type: string
      backup_enabled:
        type: boolean
      backup_retention:
        type: string
      backup_schedule:
        type: string
      database:
        type: string
      name:
        type: string
    type: object
  api.gitInstallation:
    properties:
      account_login:
        type: string
      account_type:
        type: string
      created_at:
        type: string
      id:
        type: string
      installation_id:
        description: BIGINT rendered as string
        type: string
      project_id:
        type: string
      provider:
        type: string
    type: object
  api.importComposeStackRequest:
    properties:
      ack_secrets_in_git:
        type: boolean
      app_name:
        type: string
      env:
        additionalProperties:
          type: string
        type: object
      services:
        items:
          $ref: '#/definitions/models.ImportServiceSpec'
        type: array
    type: object
  api.ingestLogsRequest:
    properties:
      level:
        type: string
      message:
        type: string
      source:
        type: string
    type: object
  api.ingestMetricsRequest:
    properties:
      metrics:
        additionalProperties:
          format: float64
          type: number
        type: object
      source:
        type: string
      timestamp:
        type: string
    type: object
  api.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - password
    type: object
  api.saveDashboardRequest:
    type: object
  api.setEnvVarRequest:
    properties:
      is_secret:
        type: boolean
      scope:
        type: string
      value:
        type: string
    type: object
  api.updateAppImageRequest:
    properties:
      image:
        type: string
    type: object
  models.AIModelAuthMode:
    enum:
    - apikey
    - jwt
    - public
    type: string
    x-enum-varnames:
    - AIModelAuthAPIKey
    - AIModelAuthJWT
    - AIModelAuthPublic
  models.AIModelSource:
    enum:
    - mlflow
    - s3
    - custom
    type: string
    x-enum-varnames:
    - AIModelSourceMLflow
    - AIModelSourceS3
    - AIModelSourceCustom
  models.ImportServiceSpec:
    properties:
      container_name:
        type: string
      image:
        type: string
      include:
        type: boolean
      ports:
        items:
          type: string
        type: array
      service_name:
        type: string
      volumes:
        items:
          type: string
        type: array
    type: object
  pricing.Need:
    properties:
      apps:
        type: integer
      databases:
        type: integer
      domains:
        type: integer
      members:
        type: integer
      storageGB:
        type: integer
    type: object
info:
  contact: {}
  description: |-
    Platform API to order and manage cloud resources — managed databases, apps, VMs (app servers), AI models, and public API endpoints — on the DADA Cloud platform.
    Mutations are asynchronous: create/update/delete enqueue an operation and return 202 Accepted with an operation object; poll GET /projects/{projectId}/operations/{operationId} until the operation reaches a terminal status (Ready or Failed).
  title: DADA Cloud Console API
  version: "1.0"
paths:
  /admin/operations:
    get:
      description: Returns operations in the WaitingForApproval state across all projects
        where the caller is a platform-admin, each with the project name and requester.
        Read-only. The GPU-model creation gate is the first consumer.
      operationId: listAdminApprovals
      produces:
      - application/json
      responses:
        "200":
          description: object with an approvals array
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List operations awaiting admin approval
      tags:
      - admin
  /admin/operations/{opId}/approve:
    post:
      consumes:
      - application/json
      description: Approves a WaitingForApproval operation, transitioning it to Created
        so the dispatcher executes it. Platform-admin only. An optional note is recorded
        in the audit trail.
      operationId: approveOperation
      parameters:
      - description: Operation UUID
        in: path
        name: opId
        required: true
        type: string
      - description: Optional object with a note string
        in: body
        name: body
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: object with the updated operation
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Approve an operation awaiting approval
      tags:
      - admin
  /admin/operations/{opId}/reject:
    post:
      consumes:
      - application/json
      description: Rejects a WaitingForApproval operation, transitioning it to Cancelled.
        Platform-admin only. A reason is required and surfaced to the requester in
        the operations timeline.
      operationId: rejectOperation
      parameters:
      - description: Operation UUID
        in: path
        name: opId
        required: true
        type: string
      - description: Object with a required reason string
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: object with the updated operation
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reject an operation awaiting approval
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Authenticates a user by username or email plus password and returns
        a JWT bearer token. Public endpoint — no authentication required. Use the
        returned token as the Authorization: Bearer header for every other endpoint.'
      operationId: login
      parameters:
      - description: Login credentials (username or email, plus password)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: object with the JWT token and the authenticated user
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in and obtain a bearer token
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the identity (id, username, email, display name) of the
        user owning the bearer token. Read-only. Useful to confirm who the token belongs
        to before taking actions.
      operationId: getCurrentUser
      produces:
      - application/json
      responses:
        "200":
          description: object with the authenticated user
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the current authenticated user
      tags:
      - auth
  /billing/plans:
    get:
      description: Returns all available billing plans with quotas, capabilities,
        and pricing.
      operationId: getBillingPlans
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List billing plans
      tags:
      - billing
  /billing/recommend-plan:
    post:
      consumes:
      - application/json
      description: Returns the cheapest plan that satisfies the supplied resource
        requirements.
      operationId: recommendBillingPlan
      parameters:
      - description: Resource requirements
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pricing.Need'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Recommend a billing plan
      tags:
      - billing
  /git/install/callback:
    get:
      description: Public endpoint GitHub redirects to after App install. Verifies
        the signed state, persists the installation, redirects to the import wizard.
      operationId: gitInstallCallback
      parameters:
      - description: GitHub installation id
        in: query
        name: installation_id
        required: true
        type: string
      - description: Signed install state
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Found
      summary: GitHub App install callback (Setup URL)
      tags:
      - git
  /mlflow/registered-models:
    get:
      description: Returns the MLflow registered models visible to a project, filtered
        by the project's AI storage prefix. Read-only. The project query param (project
        UUID) is required.
      operationId: listMlflowModels
      parameters:
      - description: Project UUID
        in: query
        name: project
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with a models array
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List MLflow registered models for a project
      tags:
      - mlflow
  /mlflow/registered-models/{name}/versions:
    get:
      description: Returns all versions of one MLflow registered model, filtered by
        the project's AI storage prefix. Read-only. The project query param (project
        UUID) is required.
      operationId: listMlflowModelVersions
      parameters:
      - description: MLflow registered model name
        in: path
        name: name
        required: true
        type: string
      - description: Project UUID
        in: query
        name: project
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with a versions array
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List versions of an MLflow registered model
      tags:
      - mlflow
  /mlflow/registered-models/{name}/versions/{version}:
    get:
      description: Returns a single MLflow registered-model version, including its
        artifact source URI, scoped to the project's AI storage prefix. Read-only.
        The project query param (project UUID) is required.
      operationId: getMlflowModelVersion
      parameters:
      - description: MLflow registered model name
        in: path
        name: name
        required: true
        type: string
      - description: Model version
        in: path
        name: version
        required: true
        type: string
      - description: Project UUID
        in: query
        name: project
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with the version
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get one MLflow model version
      tags:
      - mlflow
  /projects:
    get:
      description: Returns every project the authenticated user is a member of, each
        annotated with the caller's role in that project. Read-only. Start here to
        discover project IDs for other calls.
      operationId: listProjects
      produces:
      - application/json
      responses:
        "200":
          description: object with a projects array
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List projects the caller can access
      tags:
      - project
    post:
      consumes:
      - application/json
      description: Creates a project plus its default environment. Without org_id
        the project goes into your personal org (you are Owner). With org_id you must
        be Owner/Admin of that org. The slug must be DNS-1123-label-safe and is unique
        platform-wide.
      operationId: createProject
      parameters:
      - description: Project to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: object with project_id, default_environment_id, org_id and
            role
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: slug already taken
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a project
      tags:
      - project
  /projects/{projectId}:
    get:
      description: Returns one project, the caller's role, and the project's environments
        (each with id, name, namespace, runtime). Read-only. Use the returned environment
        IDs for app/database/model calls.
      operationId: getProject
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with project, role and environments
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a project with its environments
      tags:
      - project
  /projects/{projectId}/app-servers:
    get:
      description: Returns all app servers (provisioned or connected VMs) in a project,
        excluding deleted ones, newest first. Read-only.
      operationId: listAppServers
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with an app_servers array
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List app servers (VMs) in a project
      tags:
      - appserver
    post:
      consumes:
      - application/json
      description: 'Creates an app server either by provisioning a new VM via Terraform
        (mode=terraform, the default) or by connecting an existing VM over SSH (mode=manual,
        requires vm_ip and ssh_private_key). Asynchronous: returns 202 with an operation;
        poll the operation until terminal.'
      operationId: createAppServer
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: App server specification
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createAppServerRequest'
      produces:
      - application/json
      responses:
        "202":
          description: object with the accepted operation
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Provision or connect an app server (VM)
      tags:
      - appserver
  /projects/{projectId}/app-servers/{serverName}:
    delete:
      description: 'Destructive: tears down the app server. For Terraform-provisioned
        servers this destroys the underlying VM and is irreversible. Asynchronous:
        returns 202 with an operation; poll the operation until terminal.'
      operationId: deleteAppServer
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: App server name
        in: path
        name: serverName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: object with the accepted operation
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an app server (VM)
      tags:
      - appserver
    get:
      description: Returns one app server's record (status, VM IP, provider, Portainer
        endpoint) by name. Read-only.
      operationId: getAppServer
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: App server name
        in: path
        name: serverName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with the app_server
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get an app server (VM) by name
      tags:
      - appserver
  /projects/{projectId}/app-servers/{serverName}/discover:
    post:
      description: 'Inventories the containers, images, ports and named volumes running
        on an enrolled VM through the Portainer docker proxy — no SSH. Produces an
        external-volume compose block for the GitOps migration. Requires the VM to
        be enrolled (has a Portainer endpoint). Asynchronous: returns 202 with an
        operation; poll it and read validation_result.'
      operationId: discoverAppServerWorkload
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: App server name
        in: path
        name: serverName
