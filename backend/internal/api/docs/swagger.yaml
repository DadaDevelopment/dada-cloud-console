  /agent/chat:
    post:
      consumes:
      - application/json
      description: Streams Server-Sent Events for a single chat turn. Runs a server-side
        ReAct loop against the ADR-015 LLM gateway, grounding answers with a curated
        read-only subset of the console's own API (plus create_support_ticket) executed
        under the caller's own bearer. Emits token events (assistant text deltas),
        tool_call events (tool name only), an error event on a friendly failure (gateway
        not configured, daily cap reached, upstream error), and a final done event.
        Sending the literal message "__slowtest__" instead streams a 75s heartbeat
        run to prove the endpoint survives the ingress proxy-read-timeout.
      operationId: agentChat
      parameters:
      - description: Chat turn
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.agentChatRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: text/event-stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Stream a chat turn with the console agent
      tags:
      - agent
  /agent/chat/confirm:
    post:
      consumes:
      - application/json
      description: Resumes a chat turn that interrupted on a write-tool call (see
        the confirm_request SSE event from POST /agent/chat). On approve, executes
        the tool for real under this request's own bearer (RBAC re-checked by the
        self-proxy), appends the result, and continues the ReAct loop to a final answer
        — which may itself interrupt again on a further write call. On reject, appends
        a decline notice and continues without executing anything. Streams Server-Sent
        Events like /agent/chat; an error event with a code (not_found/forbidden/expired/conflict)
        is emitted instead of an HTTP error status once the stream has started.
      operationId: agentChatConfirm
      parameters:
      - description: Confirm decision
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.agentChatConfirmRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: text/event-stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Approve or reject a pending agent write action
      tags:
      - agent
  /agent/chat/context/clear:
    post:
      consumes:
      - application/json
      description: 'Resets what the next chat turn sends the LLM as history and what
        GET /agent/chat/history reconstructs on reload -- a cluttered/stale conversation
        can be started fresh without losing anything real. Past agent_chat_messages
        rows are NOT deleted: the daily message cap and the confirm/decline audit
        trail are computed from those rows and are completely unaffected by clearing.
        Also auto-declines any write-action confirmation still open in this scope,
        since resuming it against a conversation the user just asked to forget would
        be confusing.'
      operationId: agentChatClearContext
      parameters:
      - description: Scope to clear (projectId/envId may be empty for the no-project-selected
          scope)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.agentChatClearContextRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Clear the agent's conversation context for this project/env scope
      tags:
      - agent
  /agent/chat/history:
    get:
      description: Reads back what's already in agent_chat_messages (and, if one is
        still open, the pending write-action awaiting confirm/reject) so the panel
        can restore a conversation after a page reload -- the browser-side message
        list is otherwise pure in-memory React state and disappears on refresh. Read-only;
        does not touch the LLM gateway or the daily message cap.
      operationId: agentChatGetHistory
      parameters:
      - description: Project UUID
        in: query
        name: projectId
        type: string
      - description: Environment UUID
        in: query
        name: envId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
