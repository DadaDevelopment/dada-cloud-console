  /projects/{projectId}/boxes/{boxName}/resume:
    post:
      consumes:
      - application/json
      description: 'Thaws a sleeping box and waits for its exec channel to accept
        again. The same box, the same /workspace disk, the same injected credentials
        — and NOT the same root filesystem: sleeping releases the body, so a resumed
        box is a fresh instance of the same pinned image with the persistent volume
        re-attached at /workspace. Anything written outside /workspace (packages installed
        into /usr, files under /srv or /etc) is gone after a sleep, so work that must
        outlive an idle window belongs in /workspace. Declared services are the exception
        on purpose: /etc/dada/services is stored on the persistent disk, so a resume
        restarts every service the box declared, in the working directory it declared
        — a service whose working directory was outside /workspace comes back to a
        tree that no longer exists and is reported as failed to restart. Optionally
        rebinds a fresh SSH public key so the caller need not keep one alive across
        the sleep. Asynchronous: returns 202 with an operation.'
      operationId: resumeBox
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Box name
        in: path
        name: boxName
        required: true
        type: string
      - description: Optional fresh SSH public key
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.resumeBoxRequest'
      produces:
      - application/json
      responses:
        "202":
          description: object with the accepted operation
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: box is not sleeping
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Resume (wake) a sleeping box
      tags:
      - box
