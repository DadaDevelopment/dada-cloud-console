        succeeded, failed, or absent (no compact was ever started for this path, or
        its Job has already been swept). On succeeded, also returns files_packed,
        archive_path, archive_bytes, inodes_free_before/after and inodes_freed.'
      operationId: getAppVolumeMaintenanceCompact
      parameters:
      - description: Project UUID
