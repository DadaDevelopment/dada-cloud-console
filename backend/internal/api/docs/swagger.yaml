  api.connectGitRepoRequest:
    properties:
      app_name:
        type: string
      auto_deploy:
        type: boolean
      clone_url:
        type: string
      framework_override:
        type: string
      installation_id:
        type: string
      port:
        description: |-
          Intended app spec, applied by the first successful build when it creates the
          app. Defaulted server-side when omitted: framework detection's guess if it
          finds one, else 8080. A pointer so the server can tell "field omitted" from
          "client explicitly asked for 0" — an explicit value always wins over detection.
        type: integer
      production_branch:
        type: string
      profile:
        type: string
      provider:
        description: Provider defaults to github when an installation_id is supplied.
        type: string
      replicas:
        type: integer
      repo_full_name:
        type: string
      root_dir:
        type: string
      token:
        description: 'GitLab only: a personal/project access token to store encrypted.
          Ignored for GitHub.'
        type: string
      worker:
        description: |-
          Worker marks an app with no HTTP entrypoint: port stays 0, so nothing
          downstream renders a Service or a default hostname for it.
        type: boolean
    type: object
