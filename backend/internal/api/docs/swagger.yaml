  /projects/default:
    post:
      description: Returns the caller's default project, provisioning one (in your
        personal org, you are Owner) when you have zero projects. Idempotent — repeated
        calls return the same project.
      operationId: ensureDefaultProject
      produces:
      - application/json
      responses:
