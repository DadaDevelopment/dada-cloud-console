  /projects/{projectId}/box-up:
    post:
      consumes:
      - application/json
      description: 'The single-call door to a box. Creates the box and its owning
        environment, claims a pre-warmed body, binds the caller''s identity to it,
        and returns only once a command has actually executed inside it and returned
        success — not when the API answered and not when a port accepted. The response
        carries the connection coordinates, a one-time "dadabox_" session token (shown
        exactly once, never retrievable again), a ready-to-paste mcpServers snippet
        pointing at the BOX''s own endpoint, and the measured time to ready broken
        down by phase. The box''s own endpoint is PUBLISHED on a platform hostname
        as part of coming up, so the returned coordinates answer from outside the
        cluster rather than being a Pod IP the caller cannot reach. wait_seconds defaults
        to 240 and is capped at 360: a pool hit answers in seconds, but an empty pool
        builds a body on the spot and a measured cold start is ~176s, so a smaller
        ceiling refused the exact request the product exists to serve. A cold start
        that runs past the caller''s bound answers 504 with reason cold_start_timeout,
        which is NOT pool_exhausted and does not mean the product is full. Synchronous
        rather than 202-with-an-operation because a worker poll is longer than the
        entire time-to-ready budget.'
      operationId: boxUp
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Box specification (every field optional)
        in: body
        name: body
        schema:
