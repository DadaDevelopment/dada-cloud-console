  /projects/{projectId}/boxes/{boxName}/suspend:
    post:
      description: 'Freezes the box so compute billing stops while its /workspace
        disk survives. Not destructive and not a delete: resume brings the same box
        back, with the persistent volume re-attached — but on a fresh body, so only
        /workspace crosses the sleep. Anything written outside it is released with
        the old instance. This is also what a reached spend cap does, deliberately
        — a runaway must cost the customer money, never their data. Asynchronous:
        returns 202 with an operation.'
      operationId: suspendBox
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
