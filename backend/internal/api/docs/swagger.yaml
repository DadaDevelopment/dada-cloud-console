  /projects/{projectId}/boxes/{boxName}/usage:
    get:
      description: 'Returns the box''s billed minutes and money over a window, read
        straight from the per-minute ledger. basis is always "actual": every row was
        written at the time the minute elapsed with its price frozen into it, so nothing
        here is modelled or estimated. Kinds are "active" (the box was doing your
        work) and "suspended_disk" (the box was asleep and only its disk was occupied).
        IDLE MINUTES ARE ABSENT ENTIRELY — an idle minute writes no row, which is
        why an idle box reports zero rather than a small charge. Window defaults to
        the current calendar month; ?from=&to= accept RFC3339 or unix seconds and
        may not span more than 92 days. Read-only, available to any project member.'
      operationId: getBoxUsage
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
