info:
  contact: {}
  description: |-
    Platform API to order and manage cloud resources — managed databases, apps, VMs (app servers), AI models, and public API endpoints — on the DADA Cloud platform.
    Mutations are asynchronous: create/update/delete enqueue an operation and return 202 Accepted with an operation object; poll GET /projects/{projectId}/operations/{operationId} until the operation reaches a terminal status (Ready or Failed).
  title: DADA Cloud Console API
  version: "1.0"
paths:
  /admin/ai-gateway/usage:
    get:
      description: Returns provider/project/model/source cost-and-token breakdown
        of the agent_token_usage ledger over the trailing window. Platform-admin only;
        every other caller gets 403.
      operationId: getAIGatewayUsage
      parameters:
      - description: 'Window length in days: 7 or 30 (default 7)'
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: AI Gateway usage/cost breakdown (platform-admin only)
      tags:
      - admin
  /admin/audit:
    get:
      description: Returns audit_events rows joined with the actor's email and the
        project's display name, newest first. Filters by exact action and a case-insensitive
        email substring. Platform-admin only (/platform-admins group); every other
        caller gets 403.
      operationId: listAuditEvents
      parameters:
      - description: Exact audit_events.action value
        in: query
        name: action
        type: string
      - description: Case-insensitive substring match on the actor's email
        in: query
        name: user
        type: string
      - description: 'Actor cohort: customer, internal, synthetic or platform (default:
          all)'
        in: query
        name: kind
        type: string
      - description: Comma-separated actions to hide (checkbox filter)
        in: query
        name: exclude_action
        type: string
      - description: Comma-separated actor emails to hide (checkbox filter, exact
          match)
        in: query
        name: exclude_user
        type: string
      - description: Comma-separated actor cohorts to hide (checkbox filter)
        in: query
        name: exclude_kind
        type: string
      - description: Max rows to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Rows to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: object with an events array and a total count
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List audit events (platform-admin only)
      tags:
      - admin
  /admin/audit/coverage:
    get:
      description: Returns, per action, how many operations finished in the window
        and how many of them have a row in audit_events, listing only the actions
        with a shortfall. Read access follows the rest of the admin dashboards (/platform-admins
        and /platform-analysts); every other caller gets 403.
      operationId: getAuditCoverage
      parameters:
      - description: Length of the window in days (default 30, max 90)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Operations that left no audit row (platform-admin only)
      tags:
      - admin
  /admin/audit/facets:
    get:
      description: Returns the actors (with cohort and count), actions and cohorts
        present in audit_events, heaviest first, for building the audit viewer's checkbox
        filters. Each count is cross-filtered by the other facets' exclusion lists,
        so hiding a user changes the per-action numbers. Honours the same ?kind= cohort
        filter as the trail. Platform-admin only; every other caller gets 403.
      operationId: listAuditFacets
      parameters:
      - description: 'Actor cohort: customer, internal, synthetic or platform (default:
          all)'
        in: query
        name: kind
        type: string
      - description: Comma-separated actions to hide; discounted from the actor and
          cohort counts
        in: query
        name: exclude_action
        type: string
      - description: Comma-separated actor emails to hide; discounted from the action
          and cohort counts
        in: query
        name: exclude_user
        type: string
      - description: Comma-separated actor cohorts to hide; discounted from the actor
          and action counts
        in: query
        name: exclude_kind
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with actors, actions and cohorts arrays
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List audit filter facets (platform-admin only)
      tags:
      - admin
  /admin/box/grants:
    post:
      consumes:
      - application/json
      description: 'Records that a Dada Box request code (claim) was handed a box
        during the concierge-provisioned private preview: the join between a fake-door
        lead and a real box, and the only data source for the repeat-use metric. Platform-admin
        only. Idempotent per (claim, box_id) -- re-granting the same box refreshes
        granted_at, and granting a second box to the same claim adds a row, which
        is the normal case once the first box has been reaped.'
      operationId: grantBox
      parameters:
      - description: Grant
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.grantBoxRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Record a manual Dada Box grant
      tags:
      - box
  /admin/costs:
    get:
      description: 'Returns a client -> project -> resource cost tree: OpenCost proportions
        scaled to the real hardware bill (cost), our own consumption-pricing formula
        applied to the same usage (revenue), and their difference (margin). Platform-admin
        only (/platform-admins group); every other caller gets 403.'
      operationId: getAdminCosts
      parameters:
      - description: 'Window length in days: 7 or 30 (default 30)'
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Platform cost/revenue/margin drilldown (platform-admin only)
      tags:
      - admin
  /admin/db-moves:
    get:
      description: Returns the most recent moves of logical databases between PostgreSQL
        shards with their phase, replication lag, cutover time and failure reason.
        Platform-admin and platform-analyst readers; every other caller gets 403.
      operationId: listAdminDBMoves
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Database moves between shards (admin readers)
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: 'Enqueues a move of one logical database to another PostgreSQL
        shard. The source shard, the owner role and the checks are resolved live against
        the instances: the database must exist on the shard it is currently routed
        to, must not already exist on the target, and must not be owned by the superuser.
        Returns the created move row; the move driver advances it through schema copy,
        logical replication and cutover. Platform admins only.'
      operationId: startAdminDBMove
      parameters:
      - description: Database and target shard
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.startDBMoveRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.adminDBMove'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Move a database to another shard (platform admins)
      tags:
      - admin
  /admin/db-shards:
    get:
      description: 'Returns every managed PostgreSQL shard from the registry with
        what is actually inside it: total sampled size, database count, instance uptime,
        and the largest databases with their owning project, quota tier, seven-day
        growth and open advisory counts. Databases present in the samples but absent
        from the control plane''s resource snapshots are returned with orphan=true.
        Reads collected samples only; no shard is queried live. Platform-admin and
        platform-analyst readers; every other caller gets 403.'
      operationId: getAdminDBShards
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Per-shard database consumption (admin readers)
      tags:
      - admin
  /admin/feedback:
    get:
      description: Returns feedback rows with the sender's email, how long the ticket
        has been waiting, the project/app its route named, and whether that app has
        a connected repo (which is what makes an auto-fix run possible). Platform-admin
        only; every other caller gets 403.
      operationId: listFeedback
      parameters:
      - description: 'Filter by status: new, resolved (default: all)'
        in: query
        name: status
        type: string
      - description: Max rows to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: object with an items array and a new_count
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List in-product feedback (platform-admin only)
      tags:
      - admin
  /admin/feedback/{id}/autofix:
    post:
      description: Launches a DadaAgent auto-fix run against the repo connected to
        the app the ticket's route named, using the customer's own words as the failure
        context, and links the resulting cloud task back to the ticket. Requires the
        ticket to name a project and an app with a connected repo. Platform-admin
        only.
      operationId: autofixFeedback
      parameters:
      - description: Feedback UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: object with the created cloud_task
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Auto-fix the app a feedback ticket is about (platform-admin only)
      tags:
      - admin
  /admin/feedback/{id}/resolve:
    post:
      consumes:
      - application/json
      description: Marks the ticket resolved and stores what was done about it, so
        the queue reflects reality instead of memory. Platform-admin only.
      operationId: resolveFeedback
      parameters:
      - description: Feedback UUID
        in: path
        name: id
        required: true
        type: string
      - description: Resolution note
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.resolveFeedbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Resolve a feedback ticket (platform-admin only)
      tags:
      - admin
  /admin/funnel:
    get:
      description: Metrika traffic sources, Keycloak registration steps, and resource-kind
        adoption -> paid counts for a window. account_kind filters apply to the DB-backed
        product leg only.
      operationId: getAdminFunnel
      parameters:
      - default: 30d
        description: 7d|30d|90d|all
        in: query
        name: window
        type: string
      - description: comma-separated account_kind values to hide
        in: query
        name: exclude_kind
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.adminFunnelResponse'
      summary: Full acquisition and product funnel
      tags:
      - admin
  /admin/growth/campaigns:
    get:
      description: Sent/opened/clicked/redeemed/converted per campaign, variant and
        signup week.
      operationId: getGrowthCampaigns
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Campaign funnel report (platform staff)
      tags:
      - growth
  /admin/operations:
    get:
      description: Returns operations in the WaitingForApproval state across all projects
        where the caller is a platform-admin, each with the project name and requester.
        Read-only. The GPU-model creation gate is the first consumer.
      operationId: listAdminApprovals
      produces:
      - application/json
      responses:
        "200":
          description: object with an approvals array
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List operations awaiting admin approval
      tags:
      - admin
  /admin/operations/{opId}/approve:
    post:
      consumes:
      - application/json
      description: Approves a WaitingForApproval operation, transitioning it to Created
        so the dispatcher executes it. Platform-admin only. An optional note is recorded
        in the audit trail.
      operationId: approveOperation
      parameters:
      - description: Operation UUID
        in: path
        name: opId
        required: true
        type: string
      - description: Optional object with a note string
        in: body
        name: body
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: object with the updated operation
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
