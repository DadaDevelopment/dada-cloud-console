          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Read the result of an app's volume compact
      tags:
      - app
    post:
      consumes:
      - application/json
      description: 'Creates (or reuses, if one is already running or finished for
        the same directory) a Kubernetes Job that mounts the app''s PersistentVolumeClaim
        read-write, tars the given directory (relative to the volume root, or the
        absolute form returned in the report''s top_dirs), verifies the archive before
        touching anything, and only then deletes the original files. Does not wait
        for the Job: poll GET on the same path with the same path query parameter
        for the result. 400 when the path fails validation. 404 when the app has no
        volume or is not a Kubernetes app.'
      operationId: createAppVolumeMaintenanceCompact
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Environment UUID
        in: path
        name: envId
        required: true
        type: string
      - description: App name
        in: path
        name: appName
        required: true
