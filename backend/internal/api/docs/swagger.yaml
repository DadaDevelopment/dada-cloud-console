          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: a live box with that name already exists in this project
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: no warm box available and building one failed, or the box runtime
            is not configured
