  /projects/{projectId}/operations:
    get:
      description: Returns the 50 most recent async operations for a project (newest
        first), with their current status. Read-only. Use this to track the outcome
        of create/update/delete calls.
      operationId: listOperations
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with an operations array
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List recent operations in a project
      tags:
      - operation
  /projects/{projectId}/operations/{operationId}:
    get:
      description: Returns the current state (status, error, git/argo metadata) of
        a single async operation. Read-only. Poll this after any create/update/delete
        call until the operation reaches a terminal status (Ready or Failed).
      operationId: getOperation
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Operation UUID
        in: path
        name: operationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: object with the operation
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the state of an async operation
      tags:
      - operation
  /projects/{projectId}/operations/{operationId}/retry:
    post:
      description: 'Re-queues a failed operation for another processing attempt (resets
        it to Created and clears the prior error). Only operations in the Failed state
        can be retried. Asynchronous: returns 202 with the re-queued operation; poll
        it until terminal.'
      operationId: retryOperation
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Operation UUID
        in: path
        name: operationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: object with the re-queued operation
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Retry a failed operation
      tags:
      - operation
