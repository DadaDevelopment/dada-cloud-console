            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: the monthly charge was not acknowledged, or the box is not
            in a promotable phase
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: the materialization completed but verification failed; the
            report says which check
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: box runtime not configured
          schema:
            additionalProperties:
              type: string
            type: object
      security:
