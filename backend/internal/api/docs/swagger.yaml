      produces:
      - application/json
      responses:
        "200":
          description: object with status, and on status=succeeded also files_packed/archive_path/archive_bytes/inodes_free_before/inodes_free_after/inodes_freed/finished_at;
            on status=failed also reason and hint
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
