  /projects/{projectId}/boxes/{boxName}/crystallize:
    post:
      consumes:
      - application/json
      description: 'Materializes the box''s USERLAND onto a real VM booted from a
        standard OS slug: the VM keeps its own kernel, init and bootloader, and only
        the application half of the filesystem is applied onto it. Named volumes are
        restored by mount path, env is written out of band at 0600 root, and the entrypoint
        and published ports become a systemd unit — the result runs under systemd
        with no Docker, no compose and no Portainer agent, because a crystallized
        VM is not a container host. Then it is VERIFIED: file-manifest equality on
        (path, size, mode, sha256), equality of the listening-socket set before the
        freeze and after the cutover, an sha256-per-key env comparison, and an end-to-end
        HTTP probe. Never "rsync exited 0" — an rsync that copied nothing exits 0.
        Requires ack_monthly_charge: promotion turns a per-minute body into a monthly
        VM bill, so consent is a gate and the answer is 409 without it. The full verification
        report, including the exclusion lists it applied, is returned and stored.'
      operationId: crystallizeBox
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Box name
        in: path
        name: boxName
        required: true
        type: string
      - description: Target name, domain and the monthly-charge acknowledgement
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.crystallizeBoxRequest'
      produces:
