        description: AckMonthlyCharge is consent, not a flag. Without it the answer
          is 409.
        type: boolean
      app_server_name:
        description: AppServerName names the permanent artifact.
        type: string
      command:
        description: |-
          Command, WorkingDir and Ports are the fallback for a box that never
          registered a service descriptor of its own. Without either the descriptor or
          these, nothing states what the permanent artifact should keep running, and
          the request is refused rather than promoting an idle body.
        type: string
      domain:
        description: Domain is the address the crystallized artifact answers on.
        type: string
      ports:
        items:
          type: integer
        type: array
      probe_path:
