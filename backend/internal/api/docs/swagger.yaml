        type: string
      volumes:
        items:
          type: string
        type: array
    type: object
  pricing.Need:
    properties:
      apps:
        type: integer
      databases:
        type: integer
      domains:
        type: integer
      members:
        type: integer
      storageGB:
        type: integer
