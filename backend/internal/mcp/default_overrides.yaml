# Default MCP tool curation (embedded into the backend binary).
#
# The reflective generator emits one tool per backend OpenAPI operation (~130).
# Most are niche/admin/internal (monitoring, mlflow, billing, dns CRUD, ingest
# push-endpoints, OAuth callbacks, async operation polling, account) and are
# noise for an agent — they bloat the tool list every client carries. `keep` is
# an allowlist: only the ~20 tools an agent needs for the core spin-up / deploy /
# configure / diagnose loop are exposed. New backend operations do NOT leak in.
#
# Async note: mutations return an operation id. `getOperation` is exposed so a
# caller can watch one to a terminal status; the rest of the operation* family
# (list/retry/approve/reject) stays out. "Committed" means written, not running —
# confirm the real outcome by polling listApps for the app phase.
#
# To expose the full set, mount a file at MCP_OVERRIDES_PATH with an empty `keep`.

keep:
  # Addressing. resolveRef turns "internal/prod/telemost-bot" into ids in ONE
  # call and is the intended first step: every other tool here also accepts
  # project/env/app names directly (see internal/mcp/addressing.go), so the old
  # listProjects -> getProject -> listApps walk is no longer on the path to a
  # write. It stays exposed for the case an agent wants the map itself: the
  # env-var keys the console manages, the keys actually live in the cluster,
  # the current image, and the names one level down.
  - resolveRef
  # Projects. getProject is not a nice-to-have: twelve tools below take an envId
  # path parameter and this is the ONLY operation in the whole surface that hands
  # one out for a project that already exists (listProjects returns the default
  # environment's NAME, and createProject's default_environment_id is visible once
  # and only to whoever made the call). Without it the documented deploy path is
  # unreachable from a cold start, which is exactly how it shipped for months.
  - listProjects
  - getProject
  - createProject
  # Apps (no delete/restart on purpose: delete is destructive, restart is not
  # needed — env/image changes reconcile on their own)
  - listApps
  - createApp
  - updateAppImage
  - updateAppStorage
  # adoptAppConfig is deliberately NOT here. Adoption is the platform repairing
  # its own blind spot, not a verb a caller should have to know: the deploy path
  # runs it by itself when the clobber guard would otherwise refuse. The REST
  # endpoint stays for the console UI.
  # Environment variables (get-all / put / delete — delete is safe, scoped to a key)
  - listEnvVars
  - setEnvVar
  - deleteEnvVar
  # Databases
  - listDatabases
  - createDatabase
  - getDatabaseCredentials
  # deleteDatabase stays out, unlike deleteBox: an agent that creates a database
  # and cannot release it leaks paid shard capacity, so the box argument applies
  # here too — but the lever does not work yet. Deleting a database removes its
  # ServiceDatabaseV2 from git and ArgoCD prunes the CR, while the Crossplane
  # Database and Role behind it carry deletionPolicy: Orphan (MoveApp depends on
  # that policy), and nothing issues a DROP. The row leaves the console, the data
  # stays on the shard, visible only in /admin/db-shards as orphan=true. Exposing
  # the tool before the reclaim path exists would hand agents a delete that lies.
  # Domains
  - addDomainAuthorization
  - verifyDomainAuthorization
  # Git deploy (connect a repo so pushes build + deploy)
  - listGitInstallations
  - listInstallationRepos
  - connectGitRepo
  - getGitInstallUrl
  # Builds
  - triggerBuild
  - getBuild
  # Operations — async-confirm primitive: mutations return an operation id and
  # the API tells you to poll it (Committed = written, Failed = read the message)
  - getOperation
  # Logs — one unified tool. searchLogs reads the shared OpenSearch store, scoped
  # by app (cloud/k8s) OR vm (VM/compose), so it covers both runtimes. getAppLogs
  # (Portainer container tail, VM-only) is intentionally NOT exposed to the agent.
  - searchLogs
  # App servers (VMs). The four together are the whole VM story an agent needs:
  # provision one, see what is already running on it, adopt that into managed
  # apps, and publish it on a real https hostname. attachAppServerHostname is the
  # one that closes the loop -- before it, a freshly provisioned VM could only be
  # given a public name by hand-committing DNS into the gitops repo.
  - listAppServers
  - createAppServer
  - discoverAppServerWorkload
  - importComposeStack
  - attachAppServerHostname
  # Boxes (ephemeral root sandboxes). This is the front door of the product for
  # an agent: one call gets a body, later calls get it back or let it go.
  #
  # NO COMMAND-EXECUTION TOOL HERE, AND THERE NEVER WILL BE (D6). Our MCP surface
  # is control plane only. The box hands out its OWN local MCP endpoint, which the
  # customer's agent adds as a second server, so the customer's code and model
  # credentials never traverse our API. A boxExec/boxRunCommand tool here would
  # route every keystroke of their work through us — the opposite of the promise.
  #
  # deleteBox IS exposed, unlike deleteApp above. Deleting a box is the normal end
  # of a disposable body's life, not the loss of a customer's deployment, and an
  # agent that cannot release a box it created leaks paid capacity.
  #
  # boxUp is the single-call door and the one an agent should reach for: one call
  # returns a body that has already run a command, its coordinates, a one-time
  # credential and the measured time to ready. createBox stays exposed because it is
  # the asynchronous form for a caller that does not want to hold a request open.
  #
  # attachBoxDatabase, exposeBox and crystallizeBox are the three verbs that make a
  # box a product rather than a shell: a database mid-flight, a public port, and the
  # promotion into something permanent. crystallizeBox is safe to expose despite
  # being irreversible-ish because it is gated on ack_monthly_charge — the agent
  # cannot bill the customer monthly by accident.
  #
  # NOT exposed, deliberately: nothing that runs a command. Also no session-token
  # minting tool beyond getBoxConnection, whose whole output is coordinates.
  - listBoxes
  - createBox
  - boxUp
  - getBoxState
  - getBoxConnection
  - getBoxCatalog
  - resumeBox
  - suspendBox
  - extendBox
  - deleteBox
  - attachBoxDatabase
  - listBoxAttachments
  - exposeBox
  - crystallizeBox
  - listBoxCrystallizations
  # getBoxUsage is exposed for the same reason an agent gets deleteBox: an agent
  # that spends the customer's money must be able to see how much it has spent. It
  # is read-only and per-box, and it is the only billing tool in this list —
  # /billing/* stays out, because an agent needs its own consumption, not the
  # customer's whole account.
  - getBoxUsage

rename: {}
annotate: {}
group: {}
