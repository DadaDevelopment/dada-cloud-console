# Default MCP tool curation (embedded into the backend binary).
#
# The reflective generator emits one tool per backend OpenAPI operation (~130).
# Most are niche/admin/internal (monitoring, mlflow, billing, dns CRUD, ingest
# push-endpoints, OAuth callbacks, async operation polling, account) and are
# noise for an agent — they bloat the tool list every client carries. `keep` is
# an allowlist: only the ~20 tools an agent needs for the core spin-up / deploy /
# configure / diagnose loop are exposed. New backend operations do NOT leak in.
#
# Async note: mutations return an operation id, but the operation* tools are NOT
# exposed on purpose (kept lean). Confirm results by polling listApps for the
# app phase instead.
#
# To expose the full set, mount a file at MCP_OVERRIDES_PATH with an empty `keep`.

keep:
  # Projects
  - listProjects
  - createProject
  # Apps
  - listApps
  - createApp
  - restartApp
  - updateAppImage
  - deleteApp
  # Environment variables (get-all / put / delete)
  - listEnvVars
  - setEnvVar
  - deleteEnvVar
  # Databases
  - listDatabases
  - createDatabase
  - getDatabaseCredentials
  # Domains
  - addDomainAuthorization
  - verifyDomainAuthorization
  # Builds
  - triggerBuild
  - getBuild
  # Logs (diagnose)
  - getAppLogs
  # App servers (VMs)
  - listAppServers
  - createAppServer

rename: {}
annotate: {}
group: {}
