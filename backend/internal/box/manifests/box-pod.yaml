apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: box-example-workspace
  namespace: dada-boxes
  labels:
    dada.io/box: "true"
    dada.io/box-id: example
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-box
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: box-example
  namespace: dada-boxes
  labels:
    dada.io/box: "true"
    dada.io/box-id: example
    dada.io/box-phase: parked
  annotations:
    dada.io/box-image: warm-v1
    dada.io/box-size: box-standard
    dada.io/box-region: ru-1
spec:
  hostUsers: false
  automountServiceAccountToken: false
  enableServiceLinks: false
  serviceAccountName: box-runner
  priorityClassName: other
  restartPolicy: Never
  terminationGracePeriodSeconds: 10
  activeDeadlineSeconds: 43200
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 0
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: box-example-workspace
    - name: tmp
      emptyDir:
        sizeLimit: 2Gi
    - name: run
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
  containers:
    - name: box
      image: nexus.dada-tuda.ru/dada/box-warm:v1
      imagePullPolicy: IfNotPresent
      command: ["/usr/local/bin/box-init"]
      workingDir: /workspace
      env:
        - name: BOX_ID
          value: example
        - name: BOX_BROKER_ADDR
          value: 0.0.0.0:8080
        - name: HOME
          value: /root
      ports:
        - name: broker
          containerPort: 8080
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      resizePolicy:
        - resourceName: cpu
          restartPolicy: NotRequired
        - resourceName: memory
          restartPolicy: NotRequired
      resources:
        requests:
          cpu: 667m
          memory: 4Gi
          ephemeral-storage: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 4Gi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: tmp
          mountPath: /tmp
        - name: run
          mountPath: /run/dada
      startupProbe:
        tcpSocket:
          port: broker
        periodSeconds: 1
        failureThreshold: 60
      readinessProbe:
        tcpSocket:
          port: broker
        periodSeconds: 10
        failureThreshold: 3
