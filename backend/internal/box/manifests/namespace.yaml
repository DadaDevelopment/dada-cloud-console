apiVersion: v1
kind: Namespace
metadata:
  name: dada-boxes
  labels:
    dada.io/purpose: boxes
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: box-runner
  namespace: dada-boxes
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dada-boxes-fleet
  namespace: dada-boxes
spec:
  hard:
    pods: "6"
    requests.cpu: "4"
    requests.memory: 24Gi
    limits.cpu: "12"
    limits.memory: 24Gi
    requests.ephemeral-storage: 24Gi
    limits.ephemeral-storage: 48Gi
    requests.storage: 120Gi
    persistentvolumeclaims: "12"
    services: "24"
    count/ingresses.networking.k8s.io: "24"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dada-boxes-defaults
  namespace: dada-boxes
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 4Gi
      defaultRequest:
        cpu: 667m
        memory: 4Gi
        ephemeral-storage: 1Gi
      max:
        cpu: "8"
        memory: 16Gi
        ephemeral-storage: 8Gi
    - type: PersistentVolumeClaim
      max:
        storage: 80Gi
