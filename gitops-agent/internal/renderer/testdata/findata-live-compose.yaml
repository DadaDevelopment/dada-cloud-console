services:
    backend:
        depends_on:
            - postgres
        env_file:
            - .env
        environment:
            DB_URL: postgresql+asyncpg://postgres:pswd@postgres:5432/feedback
        expose:
            - "8001"
        image: nexus.dada-tuda.ru/dada/profi-backend:master-1.0.0-522
        restart: unless-stopped
    frontend:
        environment:
            VITE_API_BASE: https://fin-data.pro
        expose:
            - "5173"
        image: nexus.dada-tuda.ru/dada/profi:master-1.0.0-535
        restart: unless-stopped
    nginx:
        depends_on:
            - backend
            - frontend
        entrypoint:
            - /bin/sh
            - -c
            - "echo \"$$NGINX_CONF_B64\" | base64 -d > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
        environment:
            NGINX_CONF_B64: 
        image: mirror.gcr.io/library/nginx:1.27-alpine
        ports:
            - "80:80"
            - "443:443"
        restart: unless-stopped
        volumes:
            - /home/ubuntuuser/compose/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
            - /etc/letsencrypt:/etc/nginx/certs:ro
            - /var/www/certbot:/var/www/certbot:ro
    postgres:
        environment:
            POSTGRES_DB: feedback
            POSTGRES_PASSWORD: pswd
            POSTGRES_USER: postgres
        image: mirror.gcr.io/library/postgres:16-alpine
        ports:
            - 65433:5432
        restart: unless-stopped
        volumes:
            - profi_pg_data:/var/lib/postgresql/data
volumes:
    profi_pg_data:
        external: true
        name: compose_profi_pg_data
