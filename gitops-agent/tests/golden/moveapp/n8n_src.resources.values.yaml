manifests:
    - apiVersion: platform.dada-tuda.ru/v1alpha1
      kind: PublicApi
      metadata:
        name: n8n
        namespace: example-project-prod
      spec:
        upstream:
          serviceName: n8n-service
          servicePort: 5678
    - apiVersion: platform.dada-tuda.ru/v1alpha1
      kind: ServiceDatabaseV2
      metadata:
        name: n8n
        labels:
          dada.io/project: example-project
          dada.io/environment: prod
          dada.io/operation: old-op
      spec:
        appRef: n8n
        namespace: example-project-prod
        engine: postgresql
        database: n8n
        backup:
          enabled: true
          frequency: daily
          retention: 7d
