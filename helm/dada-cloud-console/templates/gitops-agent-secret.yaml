{{- if and .Values.gitopsAgent.enabled (not .Values.gitopsAgent.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-gitops-agent
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Shared (global.shared) → gitops-agent env var names.
  DATABASE_URL: {{ .Values.global.shared.databaseUrl | quote }}
  GITOPS_DEFAULT_REPO_URL: {{ .Values.global.shared.gitRepoUrl | quote }}
  GITOPS_DEFAULT_USERNAME: {{ .Values.global.shared.gitUsername | quote }}
  GITOPS_DEFAULT_TOKEN: {{ .Values.global.shared.gitToken | quote }}
  GITOPS_VALUES_TOKEN_SECRET: {{ .Values.global.shared.valuesTokenSecret | quote }}
  # Service-unique secrets.
{{- range $key, $value := .Values.gitopsAgent.secret }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
