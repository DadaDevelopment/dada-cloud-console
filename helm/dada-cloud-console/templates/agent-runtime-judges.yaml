{{- if .Values.agentRuntime.enabled }}
{{- range $agent, $files := .Values.agentRuntime.agentJudges }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dada-cloud-console.fullname" $ }}-judge-{{ $agent }}
  labels:
    {{- include "dada-cloud-console.labels" $ | nindent 4 }}
data:
  {{- toYaml $files | nindent 2 }}
{{- end }}
{{- end }}
