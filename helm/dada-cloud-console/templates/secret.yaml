{{- if and .Values.backend.enabled (not .Values.backend.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-backend
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Shared (global.shared) → backend env var names.
  DB_URL: {{ .Values.global.shared.databaseUrl | quote }}
  GITOPS_VALUES_TOKEN_SECRET: {{ .Values.global.shared.valuesTokenSecret | quote }}
  PORTAINER_API_TOKEN: {{ .Values.global.shared.portainerApiToken | quote }}
  # Service-unique secrets.
{{- range $key, $value := .Values.backend.secret }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
