{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-status-reader
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
rules:
  # Read every custom platform CR so the console can discover and mirror them all
  # (ServiceDatabaseV2, PublicApi, AIModel, YandexMetrikaCounter, S3Bucket, ...).
  - apiGroups: ["platform.dada-tuda.ru"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - events
      - namespaces
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  # App-health watcher scans user-app pods for crashloop/OOM and mails the
  # owner the tail of the previous container log.
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
  # Delete-impact scan lists app-owned Ingresses and cert-manager Certificates so
  # the blast-radius preview shows raw resources not modelled as platform CRs.
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
    verbs: ["get", "list", "watch"]
  # Live-state reconciler reads workload status (replicas/readiness/image) from
  # each environment namespace to mirror it onto App snapshots.
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  # AIModel live status comes from KServe InferenceService readiness.
  - apiGroups: ["serving.kserve.io"]
    resources:
      - inferenceservices
    verbs: ["get", "list", "watch"]
  # Database backup status comes from K10 (Kasten) RestorePoints.
  - apiGroups: ["apps.kio.kasten.io"]
    resources:
      - restorepoints
    verbs: ["get", "list", "watch"]
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-status-reader
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dada-cloud-console.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "dada-cloud-console.fullname" . }}-status-reader
  apiGroup: rbac.authorization.k8s.io
---
# Least-privilege, namespaced read of the Crossplane S3Bucket connection secrets
# ("<bucket>-s3-credentials") so the console can reveal object-storage keys on
# demand. Scoped to the crossplane-system namespace and Secrets only — NOT a
# cluster-wide secret read.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-s3-creds-reader
  namespace: {{ .Values.rbac.crossplaneSecretNamespace | default "crossplane-system" }}
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-s3-creds-reader
  namespace: {{ .Values.rbac.crossplaneSecretNamespace | default "crossplane-system" }}
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dada-cloud-console.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "dada-cloud-console.fullname" . }}-s3-creds-reader
  apiGroup: rbac.authorization.k8s.io
---
# Per-database backup/restore: the console creates Kanister ActionSets in the
# managed-Postgres namespace to run pg_dump/pg_restore against a single database.
# Scoped to actionsets in that namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-db-backup
  namespace: {{ .Values.rbac.dbBackupNamespace | default "databases" }}
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cr.kanister.io"]
    resources: ["actionsets"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-db-backup
  namespace: {{ .Values.rbac.dbBackupNamespace | default "databases" }}
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dada-cloud-console.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "dada-cloud-console.fullname" . }}-db-backup
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.rbac.dbCredsReader | default true }}
---
# Reveal-on-demand of managed-database connection secrets
# ("<database>-db-credentials"). Unlike S3 (a single crossplane-system
# namespace), managed-Postgres connection secrets live in each project's own app
# namespace, which is created dynamically per project -- so a single per-namespace
# Role cannot cover them. This ClusterRole grants get on Secrets cluster-wide,
# read-only and get-only, so the console can read a database's credentials from
# whichever namespace owns it. Every reveal is gated on project write access and
# audited server-side (RevealDatabaseCredentials).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-db-creds-reader
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-db-creds-reader
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dada-cloud-console.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "dada-cloud-console.fullname" . }}-db-creds-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
