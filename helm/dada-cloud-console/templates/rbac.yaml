{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-status-reader
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
rules:
  # Read every custom platform CR so the console can discover and mirror them all
  # (ServiceDatabaseV2, PublicApi, AIModel, YandexMetrikaCounter, S3Bucket, ...).
  - apiGroups: ["platform.dada-tuda.ru"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - events
      - namespaces
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  # The autoscaler reads each namespace's ResourceQuota before raising an app's
  # resource profile. Without this the quota check cannot run, and a profile
  # that exceeds the quota is accepted into git and only rejected at
  # pod-creation time -- a resize that turns into an outage.
  - apiGroups: [""]
    resources:
      - resourcequotas
    verbs: ["get", "list", "watch"]
  # Preview gate resolves each app's Service port before reverse-proxying the
  # live preview (*.pv.dada-tuda.ru) to it.
  - apiGroups: [""]
    resources:
      - services
    verbs: ["get", "list", "watch"]
  # App-health watcher scans user-app pods for crashloop/OOM and mails the
  # owner the tail of the previous container log.
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
  # Volume export execs "tar czf" inside a running app pod to stream its PVC
  # directory out as a tar.gz, without restarting or mutating the pod.
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs: ["create"]
  # The network probe (ProbeAppNetwork) attaches a small, platform-maintained
  # debug image to a running app pod as an ephemeral container, then execs
  # fixed DNS/TCP/TLS/HTTP checks inside it. It needs its own subresource
  # because an app's own image (distroless, scratch, or anything else without
  # a shell or network tools) cannot be relied on to run diagnostics itself --
  # the ephemeral container shares the pod's network namespace but carries its
  # own toolset. Ephemeral containers cannot be removed once added, so get is
  # needed to check for an already-attached one before patching in a new one.
  - apiGroups: [""]
    resources:
      - pods/ephemeralcontainers
    verbs: ["get", "patch", "update"]
  # The autoscaler applies a grow decision to the running pod through the resize
  # subresource, which changes the container's cgroup limits in place. Without
  # it the only way to enlarge a starving app is to rewrite its Deployment
  # template, and a template change always rolls a new ReplicaSet -- so the
  # platform's answer to "this app is being throttled" would be to restart it
  # while it is under load.
  - apiGroups: [""]
    resources:
      - pods/resize
    verbs: ["patch", "update"]
  # Delete-impact scan lists app-owned Ingresses and cert-manager Certificates so
  # the blast-radius preview shows raw resources not modelled as platform CRs.
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
    verbs: ["get", "list", "watch"]
  # Live-state reconciler reads workload status (replicas/readiness/image) from
  # each environment namespace to mirror it onto App snapshots.
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  # AIModel live status comes from KServe InferenceService readiness.
  - apiGroups: ["serving.kserve.io"]
    resources:
      - inferenceservices
    verbs: ["get", "list", "watch"]
  # Database backup status comes from K10 (Kasten) RestorePoints.
  - apiGroups: ["apps.kio.kasten.io"]
    resources:
      - restorepoints
    verbs: ["get", "list", "watch"]
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-status-reader
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dada-cloud-console.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "dada-cloud-console.fullname" . }}-status-reader
  apiGroup: rbac.authorization.k8s.io
---
# Least-privilege, namespaced read of the Crossplane S3Bucket connection secrets
# ("<bucket>-s3-credentials") so the console can reveal object-storage keys on
# demand. Scoped to the crossplane-system namespace and Secrets only — NOT a
# cluster-wide secret read.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-s3-creds-reader
  namespace: {{ .Values.rbac.crossplaneSecretNamespace | default "crossplane-system" }}
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-s3-creds-reader
  namespace: {{ .Values.rbac.crossplaneSecretNamespace | default "crossplane-system" }}
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dada-cloud-console.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "dada-cloud-console.fullname" . }}-s3-creds-reader
  apiGroup: rbac.authorization.k8s.io
---
# Per-database backup/restore: the console creates Kanister ActionSets in the
# managed-Postgres namespace to run pg_dump/pg_restore against a single database.
# Scoped to actionsets in that namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-db-backup
  namespace: {{ .Values.rbac.dbBackupNamespace | default "databases" }}
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cr.kanister.io"]
    resources: ["actionsets"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-db-backup
  namespace: {{ .Values.rbac.dbBackupNamespace | default "databases" }}
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dada-cloud-console.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "dada-cloud-console.fullname" . }}-db-backup
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.rbac.dbCredsReader | default true }}
---
# Reveal-on-demand of managed-database connection secrets
# ("<database>-db-credentials"). Unlike S3 (a single crossplane-system
# namespace), managed-Postgres connection secrets live in each project's own app
# namespace, which is created dynamically per project -- so a single per-namespace
# Role cannot cover them. This ClusterRole grants get on Secrets cluster-wide,
# read-only and get-only, so the console can read a database's credentials from
# whichever namespace owns it. Every reveal is gated on project write access and
# audited server-side (RevealDatabaseCredentials).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-db-creds-reader
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-db-creds-reader
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dada-cloud-console.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "dada-cloud-console.fullname" . }}-db-creds-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.rbac.identityDelivery | default true }}
---
# Identity delivery (ADR-021 phase 2): the console mints each app's service
# token and writes it into that app's own namespace as
# "<app>-identity-credentials", so the credential never passes through git and
# the console never stores its plaintext. App namespaces are created per
# project, so like db-creds-reader this cannot be a per-namespace Role.
# Write verbs are limited to the Secret resource; list is what lets the
# reconciler find and delete copies left behind in a namespace an app has moved
# out of, which is the difference between a move that rotates nothing and a
# move that leaves a live credential readable by the old project.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-identity-delivery
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
rules:
  # patch is what points a managed database's "<app>-db-credentials" secret at
  # the connection router (DB_ROUTER_HOST): only endpoint and port are replaced,
  # so provider-sql's username and password are never read or rewritten.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-identity-delivery
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dada-cloud-console.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "dada-cloud-console.fullname" . }}-identity-delivery
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
