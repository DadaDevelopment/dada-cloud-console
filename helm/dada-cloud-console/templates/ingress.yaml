{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # WebSocket support for the values editor (/ws/values).
    # Increases idle-connection timeout so long-lived WS sessions are not killed.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "dada-cloud-console.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "dada-cloud-console.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "dada-cloud-console.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          {{- if and .Values.gitopsAgent.enabled .Values.gitopsAgent.webhookPort }}
          # WebSocket values editor — must come before the catch-all "/" rule.
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "dada-cloud-console.fullname" . }}-gitops-agent
                port:
                  number: {{ .Values.gitopsAgent.webhookPort }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dada-cloud-console.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
