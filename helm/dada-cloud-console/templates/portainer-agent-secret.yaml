{{- if and .Values.portainerAgent.enabled (not .Values.portainerAgent.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-portainer-agent
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Shared (global.shared) → portainer-agent env var names.
  DATABASE_URL: {{ .Values.global.shared.databaseUrl | quote }}
  PORTAINER_URL: {{ .Values.global.shared.portainerUrl | quote }}
  PORTAINER_API_TOKEN: {{ .Values.global.shared.portainerApiToken | quote }}
  GITOPS_REPO_URL: {{ .Values.global.shared.gitRepoUrl | quote }}
  GITOPS_USERNAME: {{ .Values.global.shared.gitUsername | quote }}
  GITOPS_TOKEN: {{ .Values.global.shared.gitToken | quote }}
  # Service-unique secrets.
{{- range $key, $value := .Values.portainerAgent.secret }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
