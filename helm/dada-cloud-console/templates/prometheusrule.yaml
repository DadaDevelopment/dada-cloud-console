{{- if and .Values.backend.enabled .Values.metrics.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-alerts
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusReleaseLabel }}
    release: {{ . }}
    {{- end }}
spec:
  groups:
    - name: dada-cloud-console.resources
      rules:
        - alert: DadaOperationFailed
          expr: max by (action) (dada_operations_failed_recent) > 0
          for: 5m
          keep_firing_for: 30m
          labels:
            severity: warning
          annotations:
            summary: "DADA operation {{`{{ $labels.action }}`}} failed"
            description: >-
              {{`{{ $value }}`}} {{`{{ $labels.action }}`}} operation(s) reached status=Failed in the
              last hour. A user create/attach (build, database, bucket, app server, domain)
              did not complete. Inspect operations.error_message for the reason.
        - alert: DadaBuildFailed
          expr: max by (namespace, service) (dada_builds_failed_recent) > 0
          for: 5m
          keep_firing_for: 30m
          labels:
            severity: warning
          annotations:
            summary: "DADA user-app build(s) failing"
            description: >-
              {{`{{ $value }}`}} user-app build(s) reached status=failed in the last hour.
              The build is the first activation step; while it is red the user's app cannot
              deploy and they see nothing — this is the activation cliff that stranded early
              signups unnoticed. Inspect builds.error_message and the Jenkins dada-build
              console for the cause, then reach out to unblock the user.
        - alert: DadaCustomDomainStuck
          expr: max by (namespace, service, hostname, project, app) (dada_domain_hostname_pending_age_seconds) > {{ .Values.metrics.alerts.customDomainStuckSeconds }}
          for: 10m
          keep_firing_for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Custom domain {{`{{ $labels.hostname }}`}} stuck attaching"
            description: >-
              {{`{{ $labels.hostname }}`}} (project {{`{{ $labels.project }}`}}, app
              {{`{{ $labels.app }}`}}) has been non-active for
              {{`{{ $value | humanizeDuration }}`}}.
              Usual cause: the user's DNS does not point at the public ingress LB, so the
              ACME HTTP-01 challenge 404s and the Let's Encrypt cert never issues. Verify the
              A/CNAME record for that hostname and the challenge state in the app's namespace.
        - alert: DadaMetricsCollectorFailing
          expr: max by (namespace, service) (increase(dada_metrics_collect_errors_total[15m])) > 3
          for: 5m
          # increase() over a 15m window falls back under the threshold as soon as the
          # errors stop arriving, then crosses again on the next batch: 4 episodes in
          # 3.4h. The collector is equally broken across the gaps.
          keep_firing_for: 30m
          labels:
            severity: warning
          annotations:
            summary: "DADA console metrics collector erroring"
            description: >-
              The console /metrics collector is failing its state queries; the resource-health
              alerts above may be blind. Check the backend logs.
    - name: dada-cloud-console.money
      rules:
        - alert: DadaOrgOverConsumingPlan
          expr: |-
            max by (org, plan) (dada_org_usage_month_rub)
            > on (org, plan)
            max by (org, plan) (dada_org_usage_allowance_rub) * {{ .Values.metrics.alerts.orgOverageFactor }}
          for: 30m
          # Consumption only ever climbs within a month, so this cannot flap
          # inside one -- but it drops to zero for everyone on the 1st. The hold
          # is short on purpose: an alert about last month's money must not
          # survive into a month the customer has already been billed for.
          keep_firing_for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Org {{`{{ $labels.org }}`}} consuming past its {{`{{ $labels.plan }}`}} plan"
            description: >-
              Org {{`{{ $labels.org }}`}} has burned {{`{{ $value | printf "%.0f" }}`}} RUB of
              list-price consumption this calendar month, over
              {{ .Values.metrics.alerts.orgOverageFactor }}x what the
              {{`{{ $labels.plan }}`}} plan includes. On the free plan the included figure is the
              footprint the tier was budgeted to cost, so this is an account being carried by the
              platform rather than a customer to invoice — decide deliberately whether to keep
              carrying it. The per-hour evidence is in app_usage; the same numbers per client are
              on /admin/costs.
    - name: dada-cloud-console.ai
      rules:
        # On 2026-08-04 the shared OpenRouter account ran out of credit. The
        # gateway answered 402 Insufficient credits to 66 of 66 calls over three
        # hours, every or-* alias went down at once, half of console chat and
        # every user's background memory fold got nothing — and no rule fired,
        # because nothing counted an upstream refusal anywhere. It was found by
        # reading pod logs by hand. These two rules are that gap closed: the
        # first says a group's callers are getting errors, the second says they
        # are getting answers only because a fallback is carrying them.
        - alert: AIModelGroupRefused
          expr: |-
            sum by (model_group, provider, status) (
              rate(dada_ai_upstream_failures_total{status=~"402|429"}[10m])
            ) > {{ .Values.metrics.alerts.aiUpstreamFailureRate }} / 60
          for: 10m
          # A dead balance does not fail evenly: a client retry storm makes the
          # rate spike and sag around the threshold, and every sag would end the
          # alert and start a new one on the next crossing. The provider is
          # equally broke across the gaps.
          keep_firing_for: 30m
          labels:
            severity: warning
          annotations:
            summary: "AI model group {{`{{ $labels.model_group }}`}} refused by {{`{{ $labels.provider }}`}} ({{`{{ $labels.status }}`}})"
            description: >-
              {{`{{ $labels.provider }}`}} is answering HTTP {{`{{ $labels.status }}`}} to
              {{`{{ $labels.model_group }}`}}. 402 means the account has stopped paying out —
              an exhausted balance, which no retry and no fallback inside the group can fix and
              which only a human with the provider's billing page can. 429 means quota, which
              may clear on its own. Check the balance on the provider's dashboard first, then
              dada_ai_fallbacks_total to see whether callers are still being served.
        - alert: AIServedByFallback
          expr: |-
            sum by (requested, served) (rate(dada_ai_fallbacks_total[15m])) > 0
          for: 15m
          # A chain that is carrying traffic flaps with the primary it is
          # covering: the primary recovers for a minute, the fallback rate drops
          # to zero, and the next refusal starts a fresh alert. One degradation,
          # not ten.
          keep_firing_for: 1h
          labels:
            severity: info
          annotations:
            summary: "{{`{{ $labels.requested }}`}} is being served by {{`{{ $labels.served }}`}}"
            description: >-
              Callers asking for {{`{{ $labels.requested }}`}} are getting answers from
              {{`{{ $labels.served }}`}} instead, so its own provider is refusing. Nobody is
              getting an error — which is the point of the chain and also the reason this needs
              saying out loud: a fully absorbed outage is invisible until the bill or the quality
              complaint arrives. Informational; act on the AIModelGroupRefused alert beside it.
    - name: dada-cloud-console.box
      rules:
        # Dada Box. Time to ready is the product claim marketing cannot
        # compensate for, so it gets two alerts: a breach counter that fires fast
        # and names the guilty phase, and an SLO regression on the p95 that fires
        # slower but catches a gradual slide the counter would not.
        - alert: BoxReadyBudgetBreached
          expr: sum by (phase) (rate(dada_box_ready_budget_breaches_total[10m])) > 0
          for: 10m
          keep_firing_for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Box spawns over the time-to-ready budget (phase {{`{{ $labels.phase }}`}})"
            description: >-
              Boxes are taking longer than the {{ .Values.metrics.alerts.boxReadyBudgetSeconds }}s
              time-to-ready budget, and {{`{{ $labels.phase }}`}} is the phase consuming the time.
              A box that is not ready in seconds is not a body for an agent — this is the core
              product claim regressing. Check dada_box_phase_duration_seconds for that phase and
              dada_box_pool_available: the usual cause is an exhausted warm pool turning every
              spawn into a cold start.
        - alert: BoxReadySLORegressed
          expr: histogram_quantile(0.95, sum by (le) (rate(dada_box_ready_duration_seconds_bucket[30m]))) > {{ .Values.metrics.alerts.boxReadyP95Seconds }}
          for: 15m
          keep_firing_for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Box time-to-ready p95 over SLO"
            description: >-
              p95 time to ready is {{`{{ $value | humanizeDuration }}`}}, over the
              {{ .Values.metrics.alerts.boxReadyP95Seconds }}s SLO. Individual spawns may still be
              inside the hard budget, so the breach counter can be quiet while this fires — that is
              the point: it catches a gradual slide before customers do.
        - alert: BoxPoolExhausted
          expr: |-
            max by (namespace, service, image, region) (dada_box_pool_available) == 0
            and on (namespace, service, image, region)
            max by (namespace, service, image, region) (dada_box_pool_target) > 0
          for: 5m
          # dada_box_pool_available oscillates 0 -> 1 -> 0 while the warmer refills:
          # measured 4 firing episodes in 1.8h of total firing time, i.e. a fresh
          # alert lifecycle per refill attempt rather than one "pool is starving".
          keep_firing_for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Box warm pool empty ({{`{{ $labels.image }}`}}/{{`{{ $labels.region }}`}})"
            description: >-
              No pre-warmed boxes left for image {{`{{ $labels.image }}`}} in
              {{`{{ $labels.region }}`}}, so every spawn now pays a cold start. Check the pool
              controller and dada_box_pool_refill_duration_seconds.
        - alert: BoxCrystallizeStateLoss
          expr: max by (namespace, service, kind) (increase(dada_box_crystallize_state_loss_total[1h])) > 0
          for: 0m
          keep_firing_for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Crystallization lost {{`{{ $labels.kind }}`}}"
            description: >-
              A crystallization failed to carry over {{`{{ $labels.kind }}`}}. The promise is that
              the same object continues living; one loss teaches the customer not to trust the
              graduation path, which severs the monetization ladder at its second step. Treat as
              customer-visible data loss: find the operation, read its validation_result
              equivalence report, and contact the customer before they find out themselves.
        - alert: BoxMeterStale
          expr: max by (namespace, service) (dada_box_metered_minutes_lag_seconds) > {{ .Values.metrics.alerts.boxMeterStaleSeconds }}
          for: 10m
          keep_firing_for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Box minute meter stalled"
            description: >-
              The newest metered box-minute is {{`{{ $value | humanizeDuration }}`}} old. Boxes bill
              per active minute, so a stalled meter is silent revenue loss that no monthly
              reconciliation will surface in time. Check dada_box_meter_errors_total and the meter
              ticker in the backend.
        - alert: BoxFailedRecent
          expr: max by (namespace, service) (dada_box_failed_recent) > 0
          for: 5m
          keep_firing_for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Box(es) failing"
            description: >-
              {{`{{ $value }}`}} box(es) reached a failed state in the last hour. An agent asked for
              a body and did not get one. Check operations.error_message for the box actions and
              the box-agent logs on the host.
        - alert: DadaDBRouteUnaddressable
          expr: max by (namespace, service, reason) (dada_db_routes_dropped) > 0
          for: 10m
          # A collision or a shard without an address does not flap back and forth on
          # its own, but a moving database can make the count dip for one scrape while
          # the snapshot catches up; keep_firing_for stops that from re-notifying.
          keep_firing_for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{`{{ $value }}`}} database(s) the DB router cannot address ({{`{{ $labels.reason }}`}})"
            description: >-
              These databases have no line of their own in the router's table, so every
              connection to them follows the wildcard to the default shard. While a database
              sits on the default shard that is harmless; the moment it is moved, its clients
              keep landing on the instance that no longer holds the data. reason=ambiguous_name
              means two databases share a name across shards (routing by name has no correct
              answer), reason=shard_unaddressed means db_shards has no host for that shard, and
              reason=unsafe_name means the datname cannot be written into a pgbouncer config
              line. Fix before moving anything: GET /internal/db/routes.ini lists each one as a
              comment.
        - alert: DadaDBShardClosed
          expr: max by (namespace, service, shard) (dada_db_shard_state{state!="open",is_platform="false"}) > 0
          for: 30m
          keep_firing_for: 1h
          labels:
            severity: info
          annotations:
            summary: "Tenant shard {{`{{ $labels.shard }}`}} is not open"
            description: >-
              The shard takes no new databases, so every new tenant database lands on the
              remaining open shards. That is the intended state while draining or migrating,
              but if it is the last tenant shard, placement has nowhere left to go. Check the
              db_shards registry and /admin/db-shards.
{{- end }}
