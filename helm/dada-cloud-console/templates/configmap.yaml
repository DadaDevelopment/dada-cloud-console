apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-config
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
data:
  # Shared (global.shared) → backend non-secret env.
  PORTAINER_URL: {{ .Values.global.shared.portainerUrl | quote }}
  PROMETHEUS_QUERY_URL: {{ .Values.global.shared.prometheusQueryUrl | default "" | quote }}
  ELASTICSEARCH_URL: {{ .Values.global.shared.elasticsearchUrl | default "" | quote }}
  CROSSPLANE_SECRET_NAMESPACE: {{ .Values.rbac.crossplaneSecretNamespace | default "crossplane-system" | quote }}
  DB_BACKUP_NAMESPACE: {{ .Values.rbac.dbBackupNamespace | default "databases" | quote }}
{{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- range $key, $value := .Values.frontend.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
  {{- /* Auto-derive GITOPS_AGENT_WS_URL from ingress.host unless explicitly set */}}
  {{- if and .Values.ingress.enabled .Values.gitopsAgent.enabled .Values.gitopsAgent.webhookPort }}
  {{- if not (hasKey .Values.backend.env "GITOPS_AGENT_WS_URL") }}
  GITOPS_AGENT_WS_URL: {{ printf "wss://%s" .Values.ingress.host | quote }}
  {{- end }}
  {{- end }}
  {{- /* Wire the backend to the build-agent. Empty BUILD_AGENT_URL → backend
         returns 503 "git integration not configured" on every git endpoint. */}}
  {{- if .Values.buildAgent.enabled }}
  {{- if not (hasKey .Values.backend.env "BUILD_AGENT_URL") }}
  BUILD_AGENT_URL: {{ printf "http://%s-build-agent:%v" (include "dada-cloud-console.fullname" .) .Values.buildAgent.webhookPort | quote }}
  {{- end }}
  {{- if and .Values.ingress.enabled (not (hasKey .Values.backend.env "BUILD_AGENT_WS_URL")) }}
  BUILD_AGENT_WS_URL: {{ printf "wss://%s" .Values.ingress.host | quote }}
  {{- end }}
  {{- /* GitHub App slug → public install URL ( github.com/apps/<slug>/installations/new ).
         Without it the install-url endpoint returns 503 and no account can be connected. */}}
  {{- if and .Values.buildAgent.gitAppSlug (not (hasKey .Values.backend.env "GIT_APP_SLUG")) }}
  GIT_APP_SLUG: {{ .Values.buildAgent.gitAppSlug | quote }}
  {{- end }}
  {{- end }}
