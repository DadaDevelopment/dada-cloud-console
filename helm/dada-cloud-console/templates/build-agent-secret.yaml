{{- if and .Values.buildAgent.enabled (not .Values.buildAgent.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-build-agent
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Shared (global.shared) → build-agent env var names.
  DATABASE_URL: {{ .Values.global.shared.databaseUrl | quote }}
  # Log-stream token HMAC — MUST match the backend (which mints the tokens).
  BUILD_AGENT_TOKEN_SECRET: {{ .Values.global.shared.buildAgentTokenSecret | quote }}
  # Service-unique secrets (Jenkins, Nexus, GitHub App, encryption).
  # NOTE: GITOPS_ENCRYPTION_KEY MUST equal gitopsAgent.secret.GITOPS_ENCRYPTION_KEY
  # — the two agents share the AES-GCM key for token/env decryption.
{{- range $key, $value := .Values.buildAgent.secret }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
