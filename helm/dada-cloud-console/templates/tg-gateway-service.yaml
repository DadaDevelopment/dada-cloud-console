{{- if .Values.tgGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-tg-gateway
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
    app.kubernetes.io/component: tg-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.tgGateway.service.port }}
      targetPort: http
  selector:
    {{- include "dada-cloud-console.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tg-gateway
{{- end }}
