{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-backend
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "dada-cloud-console.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "dada-cloud-console.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        # Rolls the backend when its own secret changes AND when
        # backend.existingSecretVersion is bumped (existingSecret mode: this
        # chart cannot see that secret's content, only a manually-bumped
        # version token). Without this, envFrom.secretRef never re-reads on
        # Secret edit -- containers keep whatever env they started with.
        checksum/secret: {{ printf "%s|%s" (include (print $.Template.BasePath "/secret.yaml") .) (.Values.backend.existingSecretVersion | default "") | sha256sum }}
    spec:
      serviceAccountName: {{ include "dada-cloud-console.fullname" . }}
      {{- with .Values.global.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "8"]
          envFrom:
            - configMapRef:
                name: {{ include "dada-cloud-console.fullname" . }}-config
            - secretRef:
                name: {{ default (printf "%s-backend" (include "dada-cloud-console.fullname" .)) .Values.backend.existingSecret }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
{{- end }}
