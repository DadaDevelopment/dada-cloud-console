{{- if .Values.agentRuntime.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dada-cloud-console.fullname" . }}-agent-runtime
  labels:
    {{- include "dada-cloud-console.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-runtime
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.agentRuntime.service.port }}
      targetPort: http
  selector:
    {{- include "dada-cloud-console.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent-runtime
{{- end }}
