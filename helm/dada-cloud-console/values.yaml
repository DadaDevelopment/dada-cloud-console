global:
  imageRegistry: ghcr.io/dada-tuda
  imagePullSecrets:
    - name: github-container-registry
  labels:
    app.kubernetes.io/part-of: dada-cloud
  # Default storage class for persistent volumes (can be overridden per-component)
  # Use "local-path" for local development or set to your cluster's default
  storageClassName: "local-path"

  # Shared credentials/config consumed by more than one service. Defined ONCE
  # here; each service's Secret/ConfigMap template maps these to its own env var
  # names (which differ per service). Do NOT also put these keys in a service's
  # per-service `secret`/`env` block — that would duplicate them.
  shared:
    # Postgres connection string (backend → DB_URL; agents → DATABASE_URL).
    databaseUrl: "postgres://dada:change-me@postgresql:5432/dada_console?sslmode=disable"
    # GitOps state repo (gitops-agent → GITOPS_DEFAULT_*; portainer-agent → GITOPS_*;
    # the latter is also what in-cluster Portainer uses to clone compose stacks).
    gitRepoUrl: "https://github.com/DADA-TUDA/argo-infra.git"
    gitUsername: "platform-bot"
    gitToken: "change-me"
    # File-editor WebSocket HMAC secret: backend signs, gitops-agent verifies.
    # Generate once: openssl rand -hex 32
    valuesTokenSecret: "change-me"
    # Build-log WebSocket HMAC secret: backend mints log-stream tokens, build-agent
    # verifies. Must be identical on both. Generate once: openssl rand -hex 32
    buildAgentTokenSecret: "change-me"
    # In-cluster Portainer: backend live-state proxy (read-only) + portainer-agent control.
    portainerUrl: "http://portainer.portainer.svc.cluster.local:9000"
    portainerApiToken: "change-me"
    # Observability READ path for the console backend. The portainer-agent installs
    # node_exporter/cAdvisor (→ Prometheus remote_write) and filebeat (→ Elasticsearch)
    # on VMs; these let the console query that data back for the metrics/logs UI.
    # Same Prometheus host/creds as the agent's PROMETHEUS_REMOTE_WRITE_*. Empty
    # values disable the respective feature (endpoints degrade to 503).
    # The backend runs IN-CLUSTER, so it reads from the in-cluster service DNS
    # (no public LB round-trip, no basic-auth needed for Prometheus reads). The
    # VM write-path uses the PUBLIC endpoints; the read-path here uses internal.
    # ElasticsearchApiKey (read-scoped) lives in the backend Secret in prod.
    prometheusQueryUrl: "http://monitoring-stack-prometheus.monitoring.svc.cluster.local:9090"  # base, no /api/v1
    prometheusQueryUser: ""
    prometheusQueryPass: ""
    elasticsearchUrl: "http://elasticsearch-infra-es-http.elastic-stack.svc.cluster.local:9200"
    elasticsearchApiKey: ""

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: dada-cloud-console-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  env:
    APP_ENV: production
    PORT: "8080"
    ARGO_CLUSTER_NAME: ""
    # Identity provider. "local" = HS256 JWT (dev default). "keycloak" = JWKS validation;
    # JWT_SECRET is not required in keycloak mode.
    AUTH_MODE: "keycloak"
    KEYCLOAK_ISSUER: "https://id.dada-tuda.ru/realms/master"
    # KEYCLOAK_VERIFY_AUD: "false" — KC access tokens often have aud="account".
    # Set to "true" and KEYCLOAK_AUDIENCE if your realm issues a specific audience.
    KEYCLOAK_VERIFY_AUD: "false"
    KEYCLOAK_AUDIENCE: "account"
    # Client whose resource_access roles are extracted; usually the M2M service client.
    KEYCLOAK_ROLES_CLIENT: "service-client"
    # Embedded MCP server (served at /mcp). Disable via MCP_ENABLED=false.
    MCP_ENABLED: "true"
    MCP_RESOURCE_URL: "https://console.dada-tuda.ru/mcp"
    # AI Studio (v1, default on). Set to "false" to hide all AI Studio
    # routes as a runtime kill-switch. Leave MLFLOW_BASE_URL empty to fall
    # back to "paste artifactURI" in the deploy wizard.
    AI_STUDIO_ENABLED: "true"
    MLFLOW_BASE_URL: ""
    # Inference proxy body cap (request + upstream response). Default 10MB.
    # Raise if a model legitimately needs larger payloads (e.g. vision).
    INFERENCE_MAX_BODY_BYTES: "10485760"
    # Elasticsearch index pattern for aggregated log search (non-secret).
    # Matches the VM filebeat bootstrap output: dada-vm-logs-<app|unknown>-<date>.
    ELASTICSEARCH_LOG_INDEX: "dada-vm-logs-*"
    # Note: PORTAINER_URL (live state) and PROMETHEUS_QUERY_URL / ELASTICSEARCH_URL
    # (observability read path) are injected from global.shared via the ConfigMap.
  existingSecret: ""
  # Service-unique secrets only. Shared keys (DB_URL, GITOPS_VALUES_TOKEN_SECRET,
  # PORTAINER_API_TOKEN) come from global.shared via the Secret template.
  secret:
    # Required in local auth mode. Not used when AUTH_MODE=keycloak.
    JWT_SECRET: ""
    # Optional MLflow Authorization header value, forwarded as-is on every
    # registry call. Empty when MLflow has no auth.
    MLFLOW_AUTH_HEADER: ""
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

gitopsAgent:
  enabled: true
  image:
    repository: dada-cloud-console-gitops-agent
    tag: "latest"
    pullPolicy: IfNotPresent
  # webhookPort: when set, exposes a /webhook/github endpoint for push events
  webhookPort: 8090
  env:
    GITOPS_DEFAULT_BRANCH: "main"
    GITOPS_BOT_NAME: "DADA Platform Bot"
    GITOPS_BOT_EMAIL: "bot@dada-tuda.ru"
    GITOPS_POLL_INTERVAL_DB: "3s"
    GITOPS_POLL_INTERVAL_GIT: "30s"
    CLUSTER_LB_IP: "93.189.231.60"
    # Same MLflow registry the backend talks to; agent uses it to resolve
    # <name, version> pins into s3:// source URIs at render time.
    # Empty disables MLflow-pinned operations (they fail with a clear error).
    MLFLOW_BASE_URL: ""
  existingSecret: ""
  # Service-unique secrets only. Shared keys (DATABASE_URL, GITOPS_DEFAULT_REPO_URL/
  # USERNAME/TOKEN, GITOPS_VALUES_TOKEN_SECRET) come from global.shared.
  secret:
    GITOPS_ENCRYPTION_KEY: "change-me-32-byte-hex-encoded-key"
    # Forwarded as-is on every MLflow registry call. Empty when MLflow has no auth.
    MLFLOW_AUTH_HEADER: ""
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# buildAgent turns a git push into a running app: webhook → build (Jenkins) →
# image (Nexus) → DeployImageVersion/CreateApp handoff → existing gitops rails.
# It is the engine behind the "Deploy from Git" flow in the console.
#
# DISABLED BY DEFAULT. Enabling the Deployment is necessary but NOT sufficient —
# the connect-repo flow also needs (see docs/runbooks/build-agent-enable.md):
#   1. A registered GitHub App (BUILD_GITHUB_APP_ID/KEY/WEBHOOK_SECRET).
#   2. A reachable Jenkins job + Nexus registry creds.
#   3. The agent's /github/install + /github/installations/:id/{repos,detect}
#      HTTP endpoints (install/list/detect are NOT implemented yet — only the
#      webhook→build→deploy path is). Until then the wizard's repo-listing steps
#      will fail even with the agent deployed.
# GITOPS_ENCRYPTION_KEY MUST equal gitopsAgent.secret.GITOPS_ENCRYPTION_KEY.
buildAgent:
  enabled: false
  image:
    repository: dada-cloud-console-build-agent
    tag: "latest"
    pullPolicy: IfNotPresent
  # HTTP port: /healthz, /metrics, /webhook/github, /ws/build.
  webhookPort: 8091
  env:
    BUILD_POLL_INTERVAL: "5s"
    BUILD_TIMEOUT: "20m"
    BUILD_MAX_CONCURRENT: "4"
    BUILD_LOG_DB_RETENTION: "168h"
    JENKINS_JOB: "dada-build"
  existingSecret: ""
  # Service-unique secrets. DATABASE_URL + BUILD_AGENT_TOKEN_SECRET come from
  # global.shared via the build-agent Secret template.
  secret:
    JENKINS_URL: ""
    JENKINS_USER: ""
    JENKINS_TOKEN: "change-me"
    NEXUS_DOCKER_HOST: ""
    NEXUS_RAW_URL: ""
    NEXUS_USER: ""
    NEXUS_TOKEN: "change-me"
    # GitHub App (register once; see runbook). APP_KEY is the PEM private key.
    BUILD_GITHUB_APP_ID: ""
    BUILD_GITHUB_APP_KEY: ""
    BUILD_GITHUB_WEBHOOK_SECRET: "change-me"
    # Shared AES-GCM key — must equal gitopsAgent.secret.GITOPS_ENCRYPTION_KEY.
    GITOPS_ENCRYPTION_KEY: "change-me-32-byte-hex-encoded-key"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

# portainerAgent is the control-plane worker that provisions/connects VMs,
# SSH-installs the Portainer Edge Agent, registers edge endpoints in the
# in-cluster Portainer, and deploys compose stacks (DeployStack) via its API.
# It is NOT the Portainer server or Portainer's edge agent.
#
# DISABLED BY DEFAULT: in the beget-prod install this worker is deployed by a
# dedicated argo-infra app (.../apps/portainer-agent) with its own chart/image,
# so enabling it here would create a duplicate that double-claims operations.
# Enable only for a fresh, self-contained install that has no separate agent.
portainerAgent:
  enabled: false
  image:
    repository: dada-cloud-console-portainer-agent
    tag: "latest"
    pullPolicy: IfNotPresent
  healthPort: 8090
  env:
    BEGET_REGION: "ru1"
    BEGET_SOFTWARE_SLUG: "ubuntu-24-04"
    TF_WORKSPACE_BASE: "/var/lib/tf-workspaces"
    TF_BIN_PATH: "/usr/local/bin/terraform"
    GITOPS_BRANCH: "main"
    GITOPS_REPO_LOCAL_PATH: "/var/lib/gitops-repos"
    GITOPS_BOT_NAME: "DADA Platform Bot"
    GITOPS_BOT_EMAIL: "bot@dada-tuda.ru"
    VM_POLL_INTERVAL_DB: "5s"
    VM_POLL_INTERVAL_STATUS: "30s"
    AGENT_CONNECT_TIMEOUT: "10m"
    # Optional observability sinks pushed onto bootstrapped VMs (URLs only;
    # credentials go in the secret). Empty disables them.
    PROMETHEUS_REMOTE_WRITE_URL: ""
    ELASTICSEARCH_URL: ""
  existingSecret: ""
  # Service-unique secrets only. Shared keys (DATABASE_URL, PORTAINER_URL,
  # PORTAINER_API_TOKEN, GITOPS_REPO_URL/USERNAME/TOKEN) come from global.shared.
  secret:
    # Beget (OpenStack) provider creds for Terraform-provisioned VMs.
    BEGET_LOGIN: ""
    BEGET_PASSWORD: ""
    BEGET_TOKEN: "change-me"
    # SSH keypair: private key used to bootstrap VMs; public key registered via Terraform.
    AGENT_SSH_PRIVATE_KEY: "change-me"
    AGENT_SSH_PUBLIC_KEY: "change-me"
    # Terraform state backend (postgres connection string).
    TF_STATE_CONN_STR: "postgres://dada:change-me@postgresql:5432/dada_console?sslmode=disable"
    PROMETHEUS_REMOTE_WRITE_USER: ""
    PROMETHEUS_REMOTE_WRITE_PASS: ""
    ELASTICSEARCH_API_KEY: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: dada-cloud-console-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 3000
  env:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: ""
    # NOTE: NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
    # These values here are purely documentation; to take effect they must be
    # passed as --build-arg to `docker build` when building the frontend image.
    # See frontend/Dockerfile ARG declarations.
    NEXT_PUBLIC_AUTH_MODE: "oidc"
    NEXT_PUBLIC_KEYCLOAK_ISSUER: "https://id.dada-tuda.ru/realms/master"
    NEXT_PUBLIC_OIDC_CLIENT_ID: "dada-console"
    # Runtime env (NOT baked). The same image serves the marketing landing and the
    # console; proxy.ts shows the landing at "/" only on this host and redirects
    # "/" → /projects on every other host. Empty = always serve the landing at "/".
    MARKETING_HOST: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: console.example.com
  tls:
    enabled: true
    secretName: dada-cloud-console-tls

rbac:
  create: true
  extraRules: []

migrationJob:
  enabled: false
  image:
    repository: dada-cloud-console-backend
    tag: "latest"
  command: ["./migrate"]
