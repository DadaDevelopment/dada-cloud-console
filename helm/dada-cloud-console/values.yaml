global:
  imageRegistry: ghcr.io/dada-tuda
  imagePullSecrets:
    - name: github-container-registry
  labels:
    app.kubernetes.io/part-of: dada-cloud
  # Default storage class for persistent volumes (can be overridden per-component)
  # Use "local-path" for local development or set to your cluster's default
  storageClassName: "local-path"
  priorityClassName: "platform"

  # Shared credentials/config consumed by more than one service. Defined ONCE
  # here; each service's Secret/ConfigMap template maps these to its own env var
  # names (which differ per service). Do NOT also put these keys in a service's
  # per-service `secret`/`env` block — that would duplicate them.
  shared:
    # Postgres connection string (backend → DB_URL; agents → DATABASE_URL).
    databaseUrl: "postgres://dada:change-me@postgresql:5432/dada_console?sslmode=disable"
    # GitOps state repo (gitops-agent → GITOPS_DEFAULT_*; portainer-agent → GITOPS_*;
    # the latter is also what in-cluster Portainer uses to clone compose stacks).
    gitRepoUrl: "https://github.com/DADA-TUDA/argo-infra.git"
    gitUsername: "platform-bot"
    gitToken: "change-me"
    # File-editor WebSocket HMAC secret: backend signs, gitops-agent verifies.
    # Generate once: openssl rand -hex 32
    valuesTokenSecret: "change-me"
    # Build-log WebSocket HMAC secret: backend mints log-stream tokens, build-agent
    # verifies. Must be identical on both. Generate once: openssl rand -hex 32
    buildAgentTokenSecret: "change-me"
    # In-cluster Portainer: backend live-state proxy (read-only) + portainer-agent control.
    portainerUrl: "http://portainer.portainer.svc.cluster.local:9000"
    portainerApiToken: "change-me"
    # Observability READ path for the console backend. The portainer-agent installs
    # node_exporter/cAdvisor (→ Prometheus remote_write) and filebeat (→ Elasticsearch)
    # on VMs; these let the console query that data back for the metrics/logs UI.
    # Same Prometheus host/creds as the agent's PROMETHEUS_REMOTE_WRITE_*. Empty
    # values disable the respective feature (endpoints degrade to 503).
    # The backend runs IN-CLUSTER, so it reads from the in-cluster service DNS
    # (no public LB round-trip, no basic-auth needed for Prometheus reads). The
    # VM write-path uses the PUBLIC endpoints; the read-path here uses internal.
    # ElasticsearchApiKey (read-scoped) lives in the backend Secret in prod.
    prometheusQueryUrl: "http://monitoring-stack-prometheus.monitoring.svc.cluster.local:9090"  # base, no /api/v1
    prometheusQueryUser: ""
    prometheusQueryPass: ""
    elasticsearchUrl: "http://elasticsearch-infra-es-http.elastic-stack.svc.cluster.local:9200"
    elasticsearchApiKey: ""
    opencostUrl: "http://opencost.opencost.svc.cluster.local:9003"

# Fully-loaded consumption pricing knobs (backend billing_fullcost.go). Tunable
# without a rebuild: edit here (gitops) or kubectl patch the config configmap +
# rollout. margin = profit multiplier after infra-overhead loading; minUtilization
# = user-share floor that caps the per-type overhead factor at 1/min.
billing:
  margin: "1.4"
  minUtilization: "0.30"

# Redis-backed fail-open cache-aside for read-heavy endpoints (backend
# internal/cache). When enabled the backend gets REDIS_ADDR pointed at the
# in-chart redis Service; when disabled the cache is a no-op passthrough.
# Ephemeral by design: no persistence (save/appendonly off), allkeys-lru
# eviction. The cache is a latency optimization, never a source of truth.
redis:
  enabled: true
  image: "redis:7.4-alpine"
  maxmemory: "128mb"
  cacheCostTTLSeconds: "300"
  cacheCostSlowTTLSeconds: "5400"
  costWarmIntervalSeconds: "150"
  costSlowWarmIntervalSeconds: "1800"
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "160Mi"

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: dada-cloud-console-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  env:
    APP_ENV: production
    PORT: "8080"
    ARGO_CLUSTER_NAME: ""
    # Custom-domain DNS targets handed to users when they attach a hostname.
    # A-record for apex domains -> public ingress LB IP; CNAME for subdomains ->
    # a stable host that A-resolves to the same LB. These MUST track the public
    # ingress migration (ingress-nginx-pub LB 155.212.223.198); the old cluster
    # IP 93.189.231.60 is dead and made every custom-domain ACME challenge 404.
    CUSTOM_DOMAIN_A_TARGET: "155.212.223.198"
    CUSTOM_DOMAIN_CNAME_TARGET: "cloud.dada-tuda.ru"
    # Managed DNS (NS delegation). PowerDNS API root (non-secret); the X-API-Key
    # is in backend.secret (POWERDNS_API_KEY). PLATFORM_NAMESERVERS are the
    # nameservers users delegate their zone to.
    POWERDNS_API_URL: "http://powerdns-api.powerdns.svc:8081"
    PLATFORM_NAMESERVERS: "ns1.dada-tuda.ru,ns2.dada-tuda.ru"
    # Identity provider. "local" = HS256 JWT (dev default). "keycloak" = JWKS validation;
    # JWT_SECRET is not required in keycloak mode.
    AUTH_MODE: "keycloak"
    KEYCLOAK_ISSUER: "https://id.dada-tuda.ru/realms/master"
    # KEYCLOAK_VERIFY_AUD: "false" — KC access tokens often have aud="account".
    # Set to "true" and KEYCLOAK_AUDIENCE if your realm issues a specific audience.
    KEYCLOAK_VERIFY_AUD: "false"
    KEYCLOAK_AUDIENCE: "account"
    # Client whose resource_access roles are extracted; usually the M2M service client.
    KEYCLOAK_ROLES_CLIENT: "service-client"
    # Embedded MCP server (served at /mcp). Disable via MCP_ENABLED=false.
    MCP_ENABLED: "true"
    MCP_RESOURCE_URL: "https://console.dada-tuda.ru/mcp"
    # AI Studio (v1, default on). Set to "false" to hide all AI Studio
    # routes as a runtime kill-switch. Leave MLFLOW_BASE_URL empty to fall
    # back to "paste artifactURI" in the deploy wizard.
    AI_STUDIO_ENABLED: "true"
    MLFLOW_BASE_URL: ""
    # Inference proxy body cap (request + upstream response). Default 10MB.
    # Raise if a model legitimately needs larger payloads (e.g. vision).
    INFERENCE_MAX_BODY_BYTES: "10485760"
    # Log index pattern for the project log viewer (logs.go, non-secret). VM logs
    # now land in the USER stream dada-app-logs-* (same as product-push app logs);
    # the VM filebeat bootstrap writes dada-app-logs-<server>-<date>.
    ELASTICSEARCH_LOG_INDEX: "dada-app-logs-*"
    # Native (k8s) app pod stdout lands in the infra stream instead, so the log
    # viewer queries it as a second source — scoped by the app's environment
    # namespaces (tenancy enforced server-side). Requires the read API key to
    # cover this pattern too. Set to "off" to disable the second query.
    ELASTICSEARCH_INFRA_LOG_INDEX: "filebeat-*"
    # Note: PORTAINER_URL (live state) and PROMETHEUS_QUERY_URL / ELASTICSEARCH_URL
    # (observability read path) are injected from global.shared via the ConfigMap.
    #
    # DadaAgent cloud-task integration (ADR-cloud-task). Non-secret half (URLs +
    # client id) lives here in the ConfigMap; the secret half (client secret +
    # GitHub App id/key) is in backend.secret below — in prod that half is patched
    # out-of-git into the existing Secret (see tasks/dadagent-cloud-task-secret-runbook.md).
    # Empty DADA_AGENT_BASE_URL/CLOUD_AGENT_CLIENT_ID disables the create handler (503).
    #   DADA_AGENT_BASE_URL  -- in-cluster DadaAgent svc (agent-sync-hub-backend:8080 → app 8001)
    #   KEYCLOAK_TOKEN_URL   — issuer + /protocol/openid-connect/token (client-credentials)
    #   CLOUD_AGENT_CLIENT_ID— Keycloak SA client the cloud uses to call the agent
    #   CLOUD_TASK_CALLBACK_URL — public webhook the agent calls back (console host)
    DADA_AGENT_BASE_URL: "http://agent-sync-hub-backend.argocd-prod.svc.cluster.local:8080"
    KEYCLOAK_TOKEN_URL: "https://id.dada-tuda.ru/realms/master/protocol/openid-connect/token"
    CLOUD_AGENT_CLIENT_ID: "dada-cloud-backend"
    CLOUD_TASK_CALLBACK_URL: "https://console.dada-tuda.ru/api/v1/webhooks/dadagent"
    # METRIKA_OAUTH_TOKEN intentionally NOT wired: the metrika-instrumentor skill
    # resolves the Metrika OAuth token itself inside the agent workspace, so the
    # backend resolver no longer reads it. Leave unset.
    # SMTP relay for outbound mail (non-secret half; SMTP_PASS is in
    # backend.secret below). Also used for the new-signup owner notification.
    SMTP_HOST: ""
    SMTP_PORT: "587"
    SMTP_USER: ""
    SMTP_FROM: ""
    # Recipient for the new-user-signup email (fires once per fresh Keycloak
    # provisioning, never on repeat logins or service accounts). Empty disables
    # the feature outright.
    SIGNUP_NOTIFY_EMAIL: ""
    # Server-side registration gate. "false" (the default in code as well) means
    # a Keycloak identity with no local users row is refused with 403
    # signup_closed instead of being provisioned on its first authenticated
    # request. Existing users keep logging in either way. This is the only gate
    # that actually holds: the realm flag does not apply to IdP first-broker
    # login, and NEXT_PUBLIC_EMAIL_SIGNUP_ENABLED only hides the button.
    SIGNUP_ENABLED: "false"
    # YooKassa (payments slice 1) non-secret half; YOOKASSA_SECRET_KEY is in
    # backend.secret below. Empty shop id disables checkout (409
    # payments_not_configured), not a 500.
    YOOKASSA_SHOP_ID: ""
    YOOKASSA_RETURN_URL: "https://console.dada-tuda.ru/billing/return"
    YOOKASSA_SEND_RECEIPT: "false"
    # YooKassa Partners OAuth client id (payments slice 2, "Connect payments" --
    # a merchant connects their OWN shop). YOOKASSA_PARTNER_CLIENT_SECRET is in
    # backend.secret below. Empty disables connect (409 payments_not_configured).
    YOOKASSA_PARTNER_CLIENT_ID: ""
  existingSecret: ""
  # Service-unique secrets only. Shared keys (DB_URL, GITOPS_VALUES_TOKEN_SECRET,
  # PORTAINER_API_TOKEN) come from global.shared via the Secret template.
  secret:
    # Required in local auth mode. Not used when AUTH_MODE=keycloak.
    JWT_SECRET: ""
    # Optional MLflow Authorization header value, forwarded as-is on every
    # registry call. Empty when MLflow has no auth.
    MLFLOW_AUTH_HEADER: ""
    # DadaAgent cloud-task secrets (ADR-cloud-task). In prod the backend uses
    # existingSecret, so these defaults are NOT rendered — they are patched
    # out-of-git into Secret dada-cloud-console-backend (kubectl patch + rollout
    # restart). See tasks/dadagent-cloud-task-secret-runbook.md. These defaults
    # only apply to a fresh, self-contained install. Empty GITHUB_APP_ID/KEY →
    # firing a cloud task 502s ("failed to mint install token").
    #   CLOUD_AGENT_CLIENT_SECRET — secret for CLOUD_AGENT_CLIENT_ID (never logged)
    #   GITHUB_APP_ID             — numeric app id of the argocd-dada GitHub App
    #   GITHUB_APP_PRIVATE_KEY    — argocd-dada App PEM signing key (never logged)
    CLOUD_AGENT_CLIENT_SECRET: ""
    GITHUB_APP_ID: ""
    GITHUB_APP_PRIVATE_KEY: ""
    # Managed DNS (NS delegation). PowerDNS API X-API-Key. Empty disables all
    # managed-DNS endpoints (503). In prod this is patched out-of-git into Secret
    # dada-cloud-console-backend, like the DadaAgent secrets above.
    POWERDNS_API_KEY: ""
    # SMTP password (Postbox, same credential as Keycloak's own mail). Empty
    # disables SMTP send outright (notify.New requires host+from, not pass, but
    # Postbox requires auth so an empty pass just fails cleanly, logged only).
    # In prod this is patched out-of-git into Secret dada-cloud-console-backend,
    # copied from the keycloak-smtp-secret password (never duplicated in git).
    SMTP_PASS: ""
    # YooKassa secret key. Empty (with empty YOOKASSA_SHOP_ID) disables
    # payments outright. In prod this is patched out-of-git into Secret
    # dada-cloud-console-backend, like the DadaAgent secrets above.
    YOOKASSA_SECRET_KEY: ""
    # YooKassa Partners OAuth client secret (payments slice 2). Empty (with
    # empty YOOKASSA_PARTNER_CLIENT_ID) disables connect outright.
    YOOKASSA_PARTNER_CLIENT_SECRET: ""
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Telemetry Gateway (ADR-012): standalone OTLP/HTTP + bespoke-JSON device-ingest
# write plane. Scaled independently of the console backend. Shares the same
# Prometheus + Elasticsearch (wired via the shared ConfigMap/Secret). Set
# gateway.databaseUrl to a READ-ONLY Postgres role (key verify + tenant resolve
# only); empty falls back to the shared DB_URL.
gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: dada-cloud-console-gateway
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8081
  # Read-only DB DSN. Recommended: a Postgres role with SELECT on monitoring_apps
  # + its joined tables only. Empty -> reuse the shared DB_URL (not least-privilege).
  databaseUrl: ""
  ingress:
    enabled: true
    # Public device-ingest host. Devices point OTEL_EXPORTER_OTLP_ENDPOINT here.
    host: ingest.dada-tuda.ru
    # Public ingress class (separate LB from the console). See ingress migration.
    className: ingress-nginx-pub
    annotations: {}
    tls:
      enabled: false
      secretName: gateway-tls
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 256Mi

gitopsAgent:
  enabled: true
  image:
    repository: dada-cloud-console-gitops-agent
    tag: "latest"
    pullPolicy: IfNotPresent
  # webhookPort: when set, exposes a /webhook/github endpoint for push events
  webhookPort: 8090
  # terminationGracePeriodSeconds: room for the agent to finish the operation in
  # its hand and hand the rest of its claimed batch back to the queue on SIGTERM
  # (db.ReleaseHeldClaims). Too short and the pod is killed mid-release, which is
  # exactly the 30-minute stranding this replaces.
  terminationGracePeriodSeconds: 60
  env:
    GITOPS_DEFAULT_BRANCH: "main"
    GITOPS_BOT_NAME: "DADA Platform Bot"
    GITOPS_BOT_EMAIL: "bot@dada-tuda.ru"
    GITOPS_POLL_INTERVAL_DB: "3s"
    GITOPS_POLL_INTERVAL_GIT: "30s"
    CLUSTER_LB_IP: "155.212.223.198"
    # Same MLflow registry the backend talks to; agent uses it to resolve
    # <name, version> pins into s3:// source URIs at render time.
    # Empty disables MLflow-pinned operations (they fail with a clear error).
    MLFLOW_BASE_URL: ""
    # Connection router (pg-router) applications reach managed Postgres through.
    # Set it and the status reconciler rewrites the endpoint in every
    # "<app>-db-credentials" secret, so a shard address stops being part of any
    # tenant's DSN and a database can move between instances without a client
    # changing anything. The direct address is preserved on the secret as
    # platform.dada-tuda.ru/db-direct-endpoint.
    #
    # Empty = off, which is today's behaviour. Turn it on only once pg-router is
    # verified live: every tenant's traffic crosses it. Shards listed in
    # DB_ROUTER_DIRECT_SHARDS keep their direct address; leave it empty. The
    # platform's own connections come from this release's shared secrets, not
    # from this reconciler, so the only thing an entry here does is hand the
    # tenant databases on that shard a shard address instead of the router.
    DB_ROUTER_HOST: ""
    DB_ROUTER_PORT: "5432"
    DB_ROUTER_DIRECT_SHARDS: ""
  existingSecret: ""
  # Service-unique secrets only. Shared keys (DATABASE_URL, GITOPS_DEFAULT_REPO_URL/
  # USERNAME/TOKEN, GITOPS_VALUES_TOKEN_SECRET) come from global.shared.
  secret:
    GITOPS_ENCRYPTION_KEY: "change-me-32-byte-hex-encoded-key"
    # Forwarded as-is on every MLflow registry call. Empty when MLflow has no auth.
    MLFLOW_AUTH_HEADER: ""
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# buildAgent turns a git push into a running app: webhook → build (Jenkins) →
# image (Nexus) → DeployImageVersion/CreateApp handoff → existing gitops rails.
# It is the engine behind the "Deploy from Git" flow in the console.
#
# DISABLED BY DEFAULT. Enabling the Deployment is necessary but NOT sufficient —
# the connect-repo flow also needs (see docs/runbooks/build-agent-enable.md):
#   1. A registered GitHub App (BUILD_GITHUB_APP_ID/KEY/WEBHOOK_SECRET).
#   2. A reachable Jenkins job + Nexus registry creds.
#   3. The agent's /github/install + /github/installations/:id/{repos,detect}
#      HTTP endpoints (install/list/detect are NOT implemented yet — only the
#      webhook→build→deploy path is). Until then the wizard's repo-listing steps
#      will fail even with the agent deployed.
# GITOPS_ENCRYPTION_KEY MUST equal gitopsAgent.secret.GITOPS_ENCRYPTION_KEY.
buildAgent:
  enabled: false
  image:
    repository: dada-cloud-console-build-agent
    tag: "latest"
    pullPolicy: IfNotPresent
  # HTTP port: /healthz, /metrics, /webhook/github, /ws/build.
  webhookPort: 8091
  # GitHub App slug — the public name in github.com/apps/<slug>. Wired to the
  # backend as GIT_APP_SLUG so the install-url endpoint can send the browser to
  # the public App install page. Empty → connect flow returns 503.
  gitAppSlug: ""
  env:
    BUILD_POLL_INTERVAL: "5s"
    BUILD_TIMEOUT: "20m"
    BUILD_MAX_CONCURRENT: "4"
    BUILD_LOG_DB_RETENTION: "168h"
    JENKINS_JOB: "dada-build"
  # Raw env entries, appended after `env` above. Unlike `env` (a plain map) these
  # may carry valueFrom, so a credential can be pulled from a Secret the platform
  # delivers instead of being written into values. Explicit env wins over envFrom,
  # so an entry here overrides the same key coming from the agent's Secret.
  # Order is preserved: kubelet expands $(VAR) top-down, so a var referenced in a
  # later entry must be defined in an earlier one.
  extraEnv: []
  existingSecret: ""
  # Service-unique secrets. DATABASE_URL + BUILD_AGENT_TOKEN_SECRET come from
  # global.shared via the build-agent Secret template.
  secret:
    JENKINS_URL: ""
    JENKINS_USER: ""
    JENKINS_TOKEN: "change-me"
    NEXUS_DOCKER_HOST: ""
    NEXUS_RAW_URL: ""
    NEXUS_USER: ""
    NEXUS_TOKEN: "change-me"
    # GitHub App (register once; see runbook). APP_KEY is the PEM private key.
    BUILD_GITHUB_APP_ID: ""
    BUILD_GITHUB_APP_KEY: ""
    BUILD_GITHUB_WEBHOOK_SECRET: "change-me"
    # Shared AES-GCM key — must equal gitopsAgent.secret.GITOPS_ENCRYPTION_KEY.
    GITOPS_ENCRYPTION_KEY: "change-me-32-byte-hex-encoded-key"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

# portainerAgent is the control-plane worker that provisions/connects VMs,
# SSH-installs the Portainer Edge Agent, registers edge endpoints in the
# in-cluster Portainer, and deploys compose stacks (DeployStack) via its API.
# It is NOT the Portainer server or Portainer's edge agent.
#
# DISABLED BY DEFAULT: in the beget-prod install this worker is deployed by a
# dedicated argo-infra app (.../apps/portainer-agent) with its own chart/image,
# so enabling it here would create a duplicate that double-claims operations.
# Enable only for a fresh, self-contained install that has no separate agent.
portainerAgent:
  enabled: false
  image:
    repository: dada-cloud-console-portainer-agent
    tag: "latest"
    pullPolicy: IfNotPresent
  healthPort: 8090
  env:
    BEGET_REGION: "ru1"
    BEGET_SOFTWARE_SLUG: "ubuntu-24-04"
    TF_WORKSPACE_BASE: "/var/lib/tf-workspaces"
    TF_BIN_PATH: "/usr/local/bin/terraform"
    GITOPS_BRANCH: "main"
    GITOPS_REPO_LOCAL_PATH: "/var/lib/gitops-repos"
    GITOPS_BOT_NAME: "DADA Platform Bot"
    GITOPS_BOT_EMAIL: "bot@dada-tuda.ru"
    VM_POLL_INTERVAL_DB: "5s"
    VM_POLL_INTERVAL_STATUS: "30s"
    AGENT_CONNECT_TIMEOUT: "10m"
    # Optional observability sinks pushed onto bootstrapped VMs (URLs only;
    # credentials go in the secret). Empty disables them.
    PROMETHEUS_REMOTE_WRITE_URL: ""
    ELASTICSEARCH_URL: ""
  # Raw env entries, appended after `env` above. Unlike `env` (a plain map) these
  # may carry valueFrom, so a credential can be pulled from a Secret the platform
  # delivers instead of being written into values. Explicit env wins over envFrom,
  # so an entry here overrides the same key coming from the agent's Secret.
  # Order is preserved: kubelet expands $(VAR) top-down, so a var referenced in a
  # later entry must be defined in an earlier one.
  extraEnv: []
  existingSecret: ""
  # Service-unique secrets only. Shared keys (DATABASE_URL, PORTAINER_URL,
  # PORTAINER_API_TOKEN, GITOPS_REPO_URL/USERNAME/TOKEN) come from global.shared.
  secret:
    # Beget (OpenStack) provider creds for Terraform-provisioned VMs.
    BEGET_LOGIN: ""
    BEGET_PASSWORD: ""
    BEGET_TOKEN: "change-me"
    # SSH keypair: private key used to bootstrap VMs; public key registered via Terraform.
    AGENT_SSH_PRIVATE_KEY: "change-me"
    AGENT_SSH_PUBLIC_KEY: "change-me"
    # Terraform state backend (postgres connection string).
    TF_STATE_CONN_STR: "postgres://dada:change-me@postgresql:5432/dada_console?sslmode=disable"
    PROMETHEUS_REMOTE_WRITE_USER: ""
    PROMETHEUS_REMOTE_WRITE_PASS: ""
    ELASTICSEARCH_API_KEY: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: dada-cloud-console-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 3000
  env:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: ""
    # NOTE: NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
    # These values here are purely documentation; to take effect they must be
    # passed as --build-arg to `docker build` when building the frontend image.
    # See frontend/Dockerfile ARG declarations.
    NEXT_PUBLIC_AUTH_MODE: "oidc"
    NEXT_PUBLIC_KEYCLOAK_ISSUER: "https://id.dada-tuda.ru/realms/master"
    NEXT_PUBLIC_OIDC_CLIENT_ID: "dada-console"
    NEXT_PUBLIC_EMAIL_SIGNUP_ENABLED: "false"
    # Runtime env (NOT baked). The same image serves the marketing landing and the
    # console; proxy.ts shows the landing at "/" only on this host and redirects
    # "/" → /projects on every other host. Empty = always serve the landing at "/".
    MARKETING_HOST: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: console.example.com
  tls:
    enabled: true
    secretName: dada-cloud-console-tls

rbac:
  create: true
  extraRules: []
  # Namespace holding the Crossplane S3Bucket connection secrets the console reads
  # to reveal object-storage credentials. A namespaced Role (not cluster-wide) is
  # granted get on Secrets here. Must match backend CROSSPLANE_SECRET_NAMESPACE.
  crossplaneSecretNamespace: crossplane-system
  # Namespace where the console creates Kanister ActionSets for per-database
  # backup/restore (the managed-Postgres namespace). Must match DB_BACKUP_NAMESPACE.
  dbBackupNamespace: databases

migrationJob:
  enabled: false
  image:
    repository: dada-cloud-console-backend
    tag: "latest"
  command: ["./migrate"]

# Observability of the console's own state machine. The backend serves state
# gauges at /metrics (operations, custom-domain health); a ServiceMonitor
# scrapes them and a PrometheusRule alerts on failed/stuck resource operations
# so the platform team hears about breakage (bad build, pending DB, stuck
# bucket/domain) before a user does. Requires prometheus-operator
# (kube-prometheus-stack). Disable the whole block if that operator is absent.
metrics:
  # PrometheusRule/ServiceMonitor need this label to be adopted by the
  # cluster's Prometheus (ruleSelector matchLabels). Match the running stack.
  prometheusReleaseLabel: kube-prometheus-stack-monitoring
  serviceMonitor:
    enabled: true
    interval: 30s
  alerts:
    enabled: true
    # Fire DadaCustomDomainStuck once a hostname stays non-active this long.
    customDomainStuckSeconds: 1800
    # Box time-to-ready. Keep boxReadyBudgetSeconds in step with
    # metrics.BoxReadyBudget in backend/internal/metrics/box.go — the backend owns
    # the breach counter, this value only renders it into the alert text.
    boxReadyBudgetSeconds: 10
    # p95 SLO for warm-path time to ready. Looser than the p50 target (3s) and
    # tighter than the hard budget, so a gradual slide fires here first.
    boxReadyP95Seconds: 8
    # Fire BoxMeterStale once the newest metered box-minute is this old.
    boxMeterStaleSeconds: 3600
    # How far over its included consumption an org must go before
    # DadaOrgOverConsumingPlan fires. 1.5 = burning half again as much as the
    # plan buys. Not 1.0: the allowance for the free tier is a budgeted
    # footprint, not a contract, and a free account a few roubles over it is
    # normal rather than actionable.
    orgOverageFactor: 1.5
    # Upstream refusals per minute, per model group, before AIModelGroupRefused
    # fires. 0.2/min ≈ one every five minutes: high enough that a single
    # unlucky call is not an alert, low enough that a provider which has
    # genuinely stopped paying out crosses it within the `for` window. On
    # 2026-08-04 OpenRouter ran at roughly 0.4/min for three hours.
    aiUpstreamFailureRate: 0.2
    # Fire DadaPaymentStuckPending once a payment has sat pending this long.
    # 30 minutes is well past a customer-present checkout (the card form times
    # out long before) and well past the sweeper's 15-minute reconcile window,
    # so anything still here is a webhook that never arrived or a sweeper that
    # is not running -- both of which leave a paying customer without the plan
    # they paid for.
    paymentStuckSeconds: 1800
    # Fire DadaPaymentSweeperStale once the hourly pending-payment sweeper has
    # not completed a pass in this long. Two ticks of slack: one missed tick is
    # a rollout, two is a wedge.
    paymentSweepStaleSeconds: 7200
